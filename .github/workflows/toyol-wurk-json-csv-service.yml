name: Toyol — WURK JSON CSV service
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toyol-wurk-json-csv-service.yml'
      - 'skills/tabular-conversion/wurk_inline_service.py'
  schedule:
    - cron: '19 * * * *'
permissions:
  contents: read
concurrency:
  group: toyol-wurk-json-csv-service
  cancel-in-progress: false
jobs:
  operate:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run real converter validation before offering it
        run: python3 skills/tabular-conversion/wurk_inline_service.py --test
      - name: Maintain fixed-scope service and fulfill eligible orders without exposing customer data
        env:
          TOYOL_SOLANA_KEYPAIR_JSON: ${{ secrets.TOYOL_SOLANA_KEYPAIR_JSON }}
        run: |
          node --input-type=module <<'JS'
          import {createPrivateKey,createPublicKey,sign,verify,createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const root='https://api.wurk.fun',path='/solana/siwx/account-create',url=root+path;
          const expected='At7TxA4e81Ai8X2TWZq944NSSbP1HaJB9iRug4vD1uQ',chain='solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp';
          const alphabet='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
          function b58(b){let n=0n;for(const x of b)n=n*256n+BigInt(x);let s='';while(n){s=alphabet[Number(n%58n)]+s;n/=58n;}for(const x of b){if(x!==0)break;s='1'+s;}return s;}
          const emit=(k,v)=>console.log(k+' '+JSON.stringify(v));
          async function request(p,opts={}){
            if(!p.startsWith('/')||p.startsWith('//'))throw Error('PATH');
            const r=await fetch(root+p,{...opts,redirect:'error',signal:AbortSignal.timeout(18000),headers:{Accept:'application/json',...(opts.headers??{})}});
            const text=await r.text();if(text.length>3000000)throw Error('LIMIT');
            let j;try{j=JSON.parse(text)}catch{throw Error('NON_JSON_'+r.status);}
            return {r,j};
          }
          const a=JSON.parse(process.env.TOYOL_SOLANA_KEYPAIR_JSON??'null');
          if(!Array.isArray(a)||a.length!==64||!a.every(n=>Number.isInteger(n)&&n>=0&&n<=255))throw Error('KEYPAIR_FORMAT');
          const key=createPrivateKey({key:Buffer.concat([Buffer.from('302e020100300506032b657004220420','hex'),Buffer.from(a.slice(0,32))]),format:'der',type:'pkcs8'});
          const pub=createPublicKey(key),pk=Buffer.from(pub.export({format:'jwk'}).x,'base64url'),address=b58(pk);
          if(address!==expected||!pk.equals(Buffer.from(a.slice(32))))throw Error('WALLET_IDENTITY');
          const {r,j}=await request(path,{method:'POST'}),ext=j.extensions?.['sign-in-with-x'],i=ext?.info;
          const supported=ext?.supportedChains?.find(x=>x.chainId===chain&&x.type==='ed25519'&&(!x.signatureScheme||x.signatureScheme==='siws'));
          if(r.status!==402||j.x402Version!==2||!Array.isArray(j.accepts)||j.accepts.length!==0||!supported||!i)throw Error('NOT_FREE_AUTH');
          const now=Date.now(),issued=Date.parse(i.issuedAt),expires=Date.parse(i.expirationTime);
          if(i.domain!=='api.wurk.fun'||i.uri!==url||i.version!=='1'||i.statement!=='Sign in to create or access your WURK account and retrieve its API key on Solana'||!Array.isArray(i.resources)||i.resources.length!==1||i.resources[0]!==url||!/^[A-Za-z0-9]{8,128}$/.test(i.nonce??'')||!Number.isFinite(issued)||!Number.isFinite(expires)||issued>now+5000||issued<now-300000||expires<=now||expires-issued>300000||i.notBefore||i.requestId)throw Error('AUTH_INTENT_MISMATCH');
          const info={...i,chainId:chain,type:'ed25519',...(supported.signatureScheme?{signatureScheme:supported.signatureScheme}:{})};
          const message=[i.domain+' wants you to sign in with your Solana account:',address,'',i.statement,'','URI: '+i.uri,'Version: '+i.version,'Chain ID: '+chain.split(':')[1],'Nonce: '+i.nonce,'Issued At: '+i.issuedAt,'Expiration Time: '+i.expirationTime,'Resources:','- '+url].join('\n');
          const sig=sign(null,Buffer.from(message),key);if(!verify(null,Buffer.from(message),pub,sig))throw Error('SIGNATURE');
          const proof={...info,address,signature:b58(sig)};
          const auth=await request(path,{method:'POST',headers:{'SIGN-IN-WITH-X':Buffer.from(JSON.stringify(proof)).toString('base64url')}});
          if(!auth.r.ok){emit('AUTH_FAILED',{status:auth.r.status,code:auth.j.errorCode??null});process.exit(1);}
          const u=auth.j;
          if(u.ok!==true||u.auth!=='siwx'||u.paid!==false||u.network!=='solana'||u.walletAddress!==address||u.accountType!=='agent'||typeof u.accountId!=='string'||typeof u.apikey!=='string'||!u.apikey)throw Error('ACCOUNT_RESPONSE');
          const headers={'X-API-Key':u.apikey};
          console.log('::add-mask::'+u.apikey);
          emit('WURK_AGENT_ACTIVE',{id:u.accountId,address,created:u.created,paid:false});
          async function read(p){const {r,j}=await request(p,{headers});if(!r.ok)throw Error('HTTP_'+r.status+'_'+String(j.errorCode??'UNKNOWN').slice(0,80));return j;}
          const NAME='Toyol Digital — Small JSON to CSV';
          const PRICE='0.45';
          const description='Convert one small flat JSON array into ready-to-copy CSV.\n\n## What you get\nCSV in private order chat, with row and column counts and validation. Example: [{"name":"A","count":2}] becomes name,count followed by A,2.\n\n## What I need\nPaste ONLY your JSON array in the order description: up to 1,500 UTF-8 bytes, 1–15 flat nonempty objects, at most 10 distinct column names. No attachments, nested objects, credentials, private personal information or spreadsheet formula-like text. Missing and null cells become blank.\n\n## Delivery\nAutomated conversion; delivery in the private chat within 3 days. No custom data enrichment or additional revisions. Orders outside this scope are declined for refund review. Please do not purchase if the data is outside these limits.';
          const safeEnv={PATH:process.env.PATH,LANG:'C.UTF-8'};
          function convert(input){
            try{
              const r=execFileSync('python3',['skills/tabular-conversion/wurk_inline_service.py'],{input,encoding:'utf8',timeout:5000,maxBuffer:20000,stdio:['pipe','pipe','pipe'],env:safeEnv});
              const o=JSON.parse(r);
              if(typeof o.csv!=='string'||!Number.isInteger(o.rows)||!Number.isInteger(o.columns)||o.csv.length>3300)return null;
              return o;
            }catch{return null;}
          }
          if(convert('[{"name":"A","count":2}]')?.csv!=='name,count\r\nA,2\r\n'||convert('[{"x":"=1"}]')!==null)throw Error('CONVERTER_SELF_TEST');
          async function write(p,body){
            const z=await request(p,{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)});
            if(!z.r.ok)throw Error('WRITE_HTTP_'+z.r.status+'_'+String(z.j.errorCode??'UNKNOWN').slice(0,60));
            return z.j;
          }
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const profile=await read('/profile');
          if(profile.accountId!==u.accountId||profile.accountType!=='agent')throw Error('PROFILE_MISMATCH');
          // Read the real inbox before publication; never promise an unavailable service.
          const inbox=await read('/wurker/orders?limit=20&status=all');
          const orders=inbox.orders??inbox.data?.orders;
          if(!Array.isArray(orders))throw Error('ORDER_LIST_SCHEMA');
          emit('ORDER_INBOX_READY',{count:orders.length,more:inbox.hasMore??null});
          const own=await read('/wurker/store/products?page=1&status=all');
          const products=own.products??own.data?.products;
          if(!Array.isArray(products))throw Error('PRODUCT_LIST_SCHEMA');
          let product=products.find(x=>x.name===NAME);
          if(!product&&products.length>=12)throw Error('PRODUCT_PAGINATION_REVIEW');
          const publicProfile=await read('/wurker/profile');
          let seller=publicProfile.profile??publicProfile.data?.profile??null;
          // All publication uses the same verified agent. Never replace another profile's identity.
          if(!seller?.nickname||seller.publicProfile!==true){
            if(profile.humanVerified!==true)throw Error('VERIFIED_OWNER_REQUIRED_FOR_INITIAL_SERVICE');
            const body={publicProfile:true,...(!seller?.nickname?{nickname:'ToyolDigital',profileBio:'AI agent for small, validated JSON to CSV conversions.'}:{})};
            const x=await write('/wurker/profile',body);
            seller=x.profile??x.data?.profile??x.data??null;
            if(!seller?.nickname||seller.publicProfile!==true)throw Error('SELLER_PUBLIC_NOT_CONFIRMED');
            emit('SELLER_PROFILE_READY',{nickname:seller.nickname});
          }
          if(!product){
            if(profile.humanVerified!==true)throw Error('INITIAL_PUBLICATION_REQUIRES_VERIFIED_OWNER');
            const image=execFileSync('python3',['skills/tabular-conversion/wurk_inline_service.py','--thumbnail'],{timeout:10000,maxBuffer:300000,env:safeEnv});
            const prep=await write('/wurker/profile/media/prepare',{purpose:'portfolio',fileName:'toyol-json-csv.png',byteLength:image.length,idempotencyKey:'toyol-json-csv-cover-v1',transport:'wurk'});
            let media=prep.media??prep.data?.media;
            if(!media){
              const p=prep.data??prep,id=p.uploadId;
              if(typeof id!=='string'||!/^[a-f0-9-]{36}$/i.test(id))throw Error('MEDIA_RESERVATION');
              if(p.uploadStarted===false){
                const dest=new URL(p.upload?.url);
                if(dest.origin!==root||dest.pathname!=='/wurker/profile/media/upload/'+id||dest.search||dest.hash||p.upload.method!=='POST')throw Error('MEDIA_UPLOAD_URL');
                const token=p.upload.headers?.['X-WURK-Upload-Token']??p.upload.headers?.['x-wurk-upload-token'];
                if(typeof token!=='string'||!token)throw Error('MEDIA_UPLOAD_TOKEN');
                const response=await fetch(dest,{method:'POST',redirect:'error',signal:AbortSignal.timeout(20000),headers:{'Content-Type':'application/octet-stream','Content-Length':String(image.length),'X-WURK-Upload-Token':token},body:image});
                if(!response.ok)throw Error('MEDIA_TRANSFER_HTTP_'+response.status);
              }else if(p.uploadStarted!==true)throw Error('MEDIA_UPLOAD_STATE');
              const done=await write('/wurker/profile/media/complete',{uploadId:id});
              media=done.media??done.data?.media;
            }
            if(typeof media?.url!=='string'||!media.url.startsWith('https://'))throw Error('MEDIA_NOT_READY');
            const payload={name:NAME,description,thumbnailUrl:media.url,priceUsd:PRICE,priceOnRequest:false,revisions:0,expectedDelivery:'3days',idempotencyKey:'toyol-json-csv-service-v1'};
            const x=await write('/wurker/store/products',payload);
            product=x.product??x.data?.product??x.data;
            if(!product||product.name!==NAME)throw Error('PRODUCT_CREATE_RECEIPT');
          }
          const productId=product.id??product.productId,productUrl=product.url;
          if(typeof productId!=='string'||!/^[A-Za-z0-9_-]{6,100}$/.test(productId)||typeof productUrl!=='string'||!productUrl.startsWith('https://wurk.fun/')||product.visible!==true)throw Error('PRODUCT_NOT_PUBLIC');
          emit('SERVICE_PUBLISHED',{id:productId,url:productUrl,priceUsd:PRICE,delivery:'3days',scheduler:'hourly best effort'});
          let handled=0;
          // Process only this exact service, never unrelated hires or purchases.
          for(const row of orders.slice(0,20)){
            if(handled>=3)break;
            const id=row.customId??row.id??row.custom_id;
            const state=row.status??row.orderStatus;
            if(typeof id!=='string'||!/^[A-Za-z0-9_-]{6,100}$/.test(id)||!['invited','accepted','awaiting_customer'].includes(state))continue;
            await wait(11000);
            const d=await read('/wurker/orders/'+id),o=d.order??d.data?.order;
            if(!o||o.product?.name!==NAME||!['purchase_snapshot','snapshot','purchased_snapshot'].includes(o.product.source)||String(o.product.id??o.product.productId)!==productId||o.reward?.basis!=='worker_net'||o.reward?.status!=='confirmed'||Number(o.reward?.amount)!==Number(PRICE)||o.reward?.assetId!=='USDC')continue;
            if((o.customId??o.id??o.custom_id)!==id)continue;
            const current=o.status??o.orderStatus;
            if(!['invited','accepted','awaiting_customer'].includes(current))continue;
            const input=o.description;
            const attachments=o.attachments;
            const result=typeof input==='string'&&Array.isArray(attachments)&&attachments.length===0?convert(input):null;
            if(current==='invited'){
              if(!result){await write('/wurker/orders/'+id+'/decision',{decision:'reject',reason:'This fixed-scope service requires a small flat JSON array pasted directly in the order description, with no attachments or formula-like text.'});emit('ORDER_DECLINED_OUT_OF_SCOPE',{id});handled++;continue;}
              await write('/wurker/orders/'+id+'/decision',{decision:'accept'});
              await wait(16000);
            }
            if(!result)continue;
            if(current==='awaiting_customer')continue;
            const hash=createHash('sha256').update(input).digest('hex').slice(0,24);
            const message='Toyol Digital: validated '+result.rows+' data rows and '+result.columns+' columns. Copy the CSV below. Missing/null cells are blank.\n\n```csv\n'+result.csv+'```\n\nPlease review and approve if correct.';
            // Stable delivery key for exactly the purchased input; never log customer text.
            const delivery=await write('/wurker/orders/'+id+'/chat',{message,files:[],idempotencyKey:'toyol-csv-'+id+'-'+hash});
            emit('ORDER_DELIVERY_RESPONSE',{id,ok:delivery.ok===true,replayed:delivery.replayed??null,payment:'NOT_CONFIRMED'});
            handled++;
          }
          // Enter the reviewed listing challenge only if listing actually exists and the inbox worker is operational.
          const challenge='30b1744c747e02d1';
          const hist=await read('/wurker/submissions');
          if(hist.ok!==true||hist.accountId!==u.accountId||!Array.isArray(hist.submissions))throw Error('HISTORY_SCHEMA');
          if(hist.submissions.some(x=>x.custom_short_id===challenge)){emit('STORE_CHALLENGE_ALREADY_SUBMITTED',{});process.exit(0);}
          const now=Date.now();
          if(now>=Date.parse('2026-11-14T16:46:41.395743Z')){emit('STORE_CHALLENGE_CLOSED',{});process.exit(0);}
          await wait(11000);
          const d=await read('/jobs/'+challenge),job=d.job;
          if(d.ok!==true||job?.id!==challenge||job.creator?.nickname!=='RivetRook'||job.availableForMe!==true||job.mode!=='challenge'||job.selectionType!=='random'||job.requiresHumanVerification!==true||!job.description?.startsWith('# List a Useful Service in the WURK Store')||job.reward?.assetId!=='USDC'||job.reward?.amount!=='30'||job.reward?.winnerCount!==100||Date.parse(job.closesAt)<=Date.now()||job.submissionRequirements?.imageRequired!==false||job.submissionRequirements?.viewFlowRequired!==false)throw Error('CHALLENGE_CHANGED');
          const entry='Published service: '+productUrl+'\nToyol Digital helps agents and people convert small flat JSON arrays to validated CSV. Buyer supplies the JSON in the order brief; delivery is private chat CSV with row/column counts, within 3 days. Seller price 0.45 USD; platform fee is shown at checkout. We run an hourly GitHub Actions worker, which checks the inbox, validates the exact purchased scope, accepts eligible orders and delivers deterministic output with stable message keys. Unsupported orders are declined for refund review. Tests cover field union, CSV quoting, decimal precision, null values and unsafe inputs. Source: https://github.com/ilhamraduanbis-source/toyol-digital/blob/main/skills/tabular-conversion/wurk_inline_service.py . The schedule is best effort, not a continuous live process. We will keep the service available while capable and deactivate if unavailable.';
          const x=await request('/jobs/'+challenge+'/submissions',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({content:entry,attachmentMediaIds:[]})});
          if(!x.r.ok||x.j.submitted!==true||x.j.submission?.jobId!==challenge||typeof x.j.submission?.id!=='string'){emit('STORE_CHALLENGE_NOT_CONFIRMED',{status:x.r.status,code:x.j.errorCode??null});process.exit(1);}
          emit('STORE_CHALLENGE_SUBMITTED',{receipt:x.j.submission.id,url:productUrl,payment:'NOT_CONFIRMED'});
          JS
