name: Toyol — Shared Skill Cloud
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/shared-skill-cloud.mjs'
      - 'runner/clone-missions.json'
      - '.github/workflows/toyol-shared-skill-cloud.yml'
  workflow_run:
    workflows: ['Toyol — Makefun aggregator official entry','Toyol — RaptorX original research evidence','Toyol — Frantic Delivery Executor','Toyol — First External Paid QA (0.10 USDC, no deposit)','Toyol — Real Paid Data Brief (0.02 USDC)','Toyol — Reusable protocol analysis skill tests','Toyol — Shared AI model integration']
    types: [completed]
  schedule:
    - cron: '19 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: toyol-shared-skill-cloud
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      workers: ${{ steps.roster.outputs.workers }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: roster
        name: Resolve registered agents for integration test
        env:
          EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const ids=JSON.parse(readFileSync('runner/clone-missions.json','utf8')).missions.map(m=>m.id);
          if(ids.length<1||ids.length>20||new Set(ids).size!==ids.length||ids.some(x=>!/^[a-z0-9-]{1,70}$/.test(x)))throw Error('INVALID_ROSTER');
          // Full roster on changes/manual testing; sampled routine smoke tests keep costs bounded.
          const workers=['push','workflow_dispatch'].includes(process.env.EVENT)?ids:ids.filter(x=>['frantic-delivery','swarmmemo-data','payment-reconciliation'].includes(x));
          if(!workers.length)throw Error('EMPTY_TEST_ROSTER');
          appendFileSync(process.env.GITHUB_OUTPUT,'workers='+JSON.stringify(workers)+'\n');
          console.log('AGENT_TEST_ROSTER',JSON.stringify(workers));
          JS
  cross-worker:
    needs: plan
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        worker: ${{ fromJSON(needs.plan.outputs.workers) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Independently use the same shared skills
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          node src/shared-skill-cloud.mjs --self-test
          node src/shared-skill-cloud.mjs agent "$WORKER" "research csv" > "$RUNNER_TEMP/context.json"
          node src/shared-skill-cloud.mjs run protocol-analysis --self-test
          printf 'id,name\n001,Test\n' > "$RUNNER_TEMP/input.csv"
          node src/shared-skill-cloud.mjs run tabular-conversion csv-to-json "$RUNNER_TEMP/input.csv" "$RUNNER_TEMP/output.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1])
          assert json.loads((p/'output.json').read_text())==[{'id':'001','name':'Test'}]
          j=json.loads((p/'context.json').read_text())
          assert len(j['skills'])==4
          assert j['mission']['id']==j['worker']
          assert j['decision']['liveExecutionAuthorized'] is False
          assert all(x['worker']==j['worker'] for x in j['ownObservations'])
          print('SHARED_WORKER_EXECUTED_TWO_SKILLS',j['worker'],[(x['id'],x['sha256']) for x in j['skills']])
          PY
  collect:
    needs: cross-worker
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
      actions: read
    steps:
      - name: Synchronize durable shared observations from real clone runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request,urllib.error,urllib.parse,io,zipfile,re,math
          root='https://api.github.com/repos/ilhamraduanbis-source/toyol-digital'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'ToyolSkillCloud'}
          def api(path,method='GET',body=None):
              req=urllib.request.Request(root+path,headers={**headers,**({'Content-Type':'application/json'} if body else {})},method=method,data=json.dumps(body).encode() if body else None)
              with urllib.request.urlopen(req,timeout=15) as r:
                  raw=r.read(5000001)
                  if len(raw)>5000000:raise ValueError('response limit')
                  return json.loads(raw)
          file='/contents/runner/shared-memory.json'
          old=api(file+'?ref=main')
          memory=json.loads(base64.b64decode(old['content']))
          assert memory['version']==1 and isinstance(memory['observations'],list)
          seen={x['runId'] for x in memory['observations']}
          cfg=api('/contents/runner/clone-missions.json?ref=main')
          missions=json.loads(base64.b64decode(cfg['content']))['missions']
          registry={m['id']:m['workflow'] for m in missions}
          assert len(registry)==len(missions) and 0<len(registry)<=20
          # Preserve historical and common skill observations as well.
          registry.update({'raptorx':'toyol-raptorx-research.yml','protocol-analysis':'toyol-protocol-analysis-skill.yml','ai-model-development':'toyol-agent-ai.yml'})
          added=[]
          for worker,name in registry.items():
              try:
                  rows=api('/actions/workflows/'+name+'/runs?branch=main&status=completed&per_page=3')['workflow_runs']
                  for run in reversed(rows):
                      rid=run['id']
                      if rid in seen or run['status']!='completed' or run.get('head_branch')!='main':continue
                      jobs=api('/actions/runs/'+str(rid)+'/jobs?per_page=30')['jobs']
                      # Only bounded status metadata. Never collect logs, prompts, credentials, or raw customer data.
                      failed=[s['name'][:140] for j in jobs for s in j.get('steps',[]) if s.get('conclusion')=='failure'][:6]
                      skipped=[s['name'][:140] for j in jobs for s in j.get('steps',[]) if s.get('conclusion')=='skipped'][:6]
                      outcome=run.get('conclusion') or 'unknown'
                      lesson='Inspect failed step before retry; change approach instead of duplicating work.' if failed else 'Workflow completion alone does not establish delivery, acceptance, or payment.'
                      if worker=='aggregator' and failed:lesson='Check real free-provider response and native session evidence before another build. Never fabricate transcripts or repeat paid requests.'
                      if worker=='raptorx':lesson='Verify actual platform report controls and report output, not browser exit code. Stop on ambiguous controls or cost gates.'
                      added.append({'worker':worker,'runId':rid,'attempt':run.get('run_attempt',1),'completedAt':run['updated_at'],'sourceCommit':run['head_sha'],'conclusion':outcome,'failedSteps':failed,'skippedSteps':skipped,'lesson':lesson,'incomeInferred':False})
                      seen.add(rid)
              except Exception as e:print('SOURCE_UNAVAILABLE',worker,type(e).__name__)
          # Share only independently checked action receipts from trusted successful development runs.
          # Model prose, raw prompts, external artifacts and commands never enter the durable cloud.
          action_menu=['audit-roster','audit-memory','test-tabular','test-protocol','test-documentation']
          current_ids={m['id'] for m in missions}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          def archive_bytes(aid):
              if not isinstance(aid,int) or aid<1:raise ValueError('artifact id')
              op=urllib.request.build_opener(NoRedirect())
              req=urllib.request.Request(root+'/actions/artifacts/'+str(aid)+'/zip',headers=headers)
              try:
                  with op.open(req,timeout=20) as f: raw=f.read(2000001)
              except urllib.error.HTTPError as e:
                  if e.code not in (301,302,303,307,308):raise
                  url=e.headers.get('Location','')
                  dest=urllib.parse.urlsplit(url)
                  host=dest.hostname or ''
                  if dest.scheme!='https' or dest.username or dest.password or not (host.endswith('.blob.core.windows.net') or host.endswith('.actions.githubusercontent.com') or host.endswith('.githubusercontent.com')):
                      raise ValueError('artifact redirect host')
                  # Signed storage redirect is fetched without forwarding GitHub authorization.
                  with op.open(urllib.request.Request(url,headers={'User-Agent':'ToyolSkillCloud'}),timeout=20) as f:raw=f.read(2000001)
              if len(raw)>2000000:raise ValueError('archive limit')
              return raw
          def verified_receipts(run):
              arts=api('/actions/runs/'+str(run['id'])+'/artifacts?per_page=20')['artifacts']
              candidates=[a for a in arts if a.get('name')=='toyol-local-ai-test-evidence' and not a.get('expired') and 0<a.get('size_in_bytes',0)<=2000000]
              if len(candidates)!=1:return []
              with zipfile.ZipFile(io.BytesIO(archive_bytes(candidates[0]['id']))) as z:
                  matches=[n for n in z.namelist() if n in ('action-receipts.json','out/agent-ai/action-receipts.json')]
                  if not matches:return []
                  if len(matches)!=1 or z.getinfo(matches[0]).file_size>250000:raise ValueError('receipt archive schema')
                  data=json.loads(z.read(matches[0]))
              historical_cfg=api('/contents/runner/clone-missions.json?ref='+run['head_sha'])
              historical_ids={m['id'] for m in json.loads(base64.b64decode(historical_cfg['content']))['missions']}
              if not isinstance(data,list) or len(data)!=len(historical_ids) or {r.get('worker') for r in data}!=historical_ids:raise ValueError('receipt roster mismatch')
              result=[]
              for r in data:
                  action=r.get('action');sel=r.get('selection',{});ev=r.get('evidence',{})
                  if action not in action_menu or r.get('status')!='VERIFIED_LOCAL_ACTION' or r.get('externalAction') is not False or r.get('ownerSpend')!=0 or r.get('incomeInferred') is not False:raise ValueError('receipt boundary')
                  scores=sel.get('scores')
                  if sel.get('worker')!=r['worker'] or sel.get('action')!=action or sel.get('method')!='constrained-model-logits' or sel.get('model')!='Qwen/Qwen2.5-0.5B-Instruct' or sel.get('revision')!='c89bee90d9f811437d9735454613c35b4a3c4dc8':raise ValueError('selection provenance')
                  if not isinstance(scores,list) or len(scores)!=5 or any(type(x) not in (float,int) or not math.isfinite(x) for x in scores) or action_menu[scores.index(max(scores))]!=action:raise ValueError('selection scores')
                  if action in ('audit-roster','audit-memory','test-tabular'):
                      count=ev.get('records')
                      if type(count)!=int or not 0<=count<=10000 or not re.fullmatch(r'[0-9a-f]{64}',str(ev.get('sha256',''))):raise ValueError('data evidence')
                      clean={'records':count,'sha256':ev['sha256']}
                      if action=='test-tabular':
                          if ev.get('lossless') is not True:raise ValueError('conversion evidence')
                          clean['lossless']=True
                      else:
                          if ev.get('findings')!=0:raise ValueError('audit findings')
                          clean['findings']=0
                  else:
                      count=ev.get('outputBytes')
                      if ev.get('exitCode')!=0 or type(count)!=int or not 0<=count<=300000 or not re.fullmatch(r'[0-9a-f]{64}',str(ev.get('outputSha256',''))):raise ValueError('test evidence')
                      clean={'exitCode':0,'outputBytes':count,'outputSha256':ev['outputSha256']}
                  result.append({'worker':r['worker'],'action':action,'runId':run['id'],'sourceCommit':run['head_sha'],'completedAt':run['updated_at'],'status':'VERIFIED_LOCAL_ACTION','evidence':clean,'externalAction':False,'incomeInferred':False})
              return result
          receipts=memory.get('actionReceipts',[])
          if not isinstance(receipts,list):raise ValueError('action receipt memory')
          known={(r['runId'],r['worker']) for r in receipts}
          new_receipts=[]
          try:
              ai_runs=api('/actions/workflows/toyol-agent-ai.yml/runs?branch=main&status=success&per_page=5')['workflow_runs']
              for run in reversed(ai_runs):
                  if run.get('conclusion')!='success' or run.get('head_branch')!='main' or run.get('head_repository',{}).get('full_name')!='ilhamraduanbis-source/toyol-digital' or run.get('event') not in ('push','workflow_dispatch') or not re.fullmatch(r'[0-9a-f]{40}',str(run.get('head_sha',''))):continue
                  if all((run['id'],wid) in known for wid in current_ids):continue
                  try:
                      for receipt in verified_receipts(run):
                          key=(receipt['runId'],receipt['worker'])
                          if key not in known:new_receipts.append(receipt);known.add(key)
                  except Exception as e:print('ACTION_EVIDENCE_UNAVAILABLE',run['id'],type(e).__name__)
          except Exception as e:print('ACTION_RECEIPT_SOURCE_UNAVAILABLE',type(e).__name__)
          if new_receipts:memory['actionReceipts']=sorted(receipts+new_receipts,key=lambda r:(r['completedAt'],r['runId'],r['worker']))[-120:]
          if added or new_receipts:
              memory['observations']=sorted(memory['observations']+added,key=lambda x:(x['completedAt'],x['runId']))[-120:]
              raw=(json.dumps(memory,indent=2,ensure_ascii=True)+'\n').encode()
              api(file,'PUT',{'message':'Sync shared Toyol clone observations (no income claim)','content':base64.b64encode(raw).decode(),'sha':old['sha'],'branch':'main'})
          print('SHARED_MEMORY_SYNC',json.dumps({'newObservations':len(added),'total':len(memory['observations']),'workers':len(registry),'newActionReceipts':len(new_receipts),'totalActionReceipts':len(memory.get('actionReceipts',[])),'incomeInferred':False}))
          PY
