name: Toyol — Shared Skill Cloud
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/shared-skill-cloud.mjs'
      - 'runner/clone-missions.json'
      - '.github/workflows/toyol-shared-skill-cloud.yml'
  workflow_run:
    workflows: ['Toyol — Makefun aggregator official entry','Toyol — RaptorX original research evidence','Toyol — Frantic Delivery Executor','Toyol — First External Paid QA (0.10 USDC, no deposit)','Toyol — Real Paid Data Brief (0.02 USDC)','Toyol — Reusable protocol analysis skill tests','Toyol — Shared AI model integration']
    types: [completed]
  schedule:
    - cron: '19 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: toyol-shared-skill-cloud
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      workers: ${{ steps.roster.outputs.workers }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: roster
        name: Resolve registered agents for integration test
        env:
          EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const ids=JSON.parse(readFileSync('runner/clone-missions.json','utf8')).missions.map(m=>m.id);
          if(ids.length<1||ids.length>20||new Set(ids).size!==ids.length||ids.some(x=>!/^[a-z0-9-]{1,70}$/.test(x)))throw Error('INVALID_ROSTER');
          // Full roster on changes/manual testing; sampled routine smoke tests keep costs bounded.
          const workers=['push','workflow_dispatch'].includes(process.env.EVENT)?ids:ids.filter(x=>['frantic-delivery','swarmmemo-data','payment-reconciliation'].includes(x));
          if(!workers.length)throw Error('EMPTY_TEST_ROSTER');
          appendFileSync(process.env.GITHUB_OUTPUT,'workers='+JSON.stringify(workers)+'\n');
          console.log('AGENT_TEST_ROSTER',JSON.stringify(workers));
          JS
  cross-worker:
    needs: plan
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        worker: ${{ fromJSON(needs.plan.outputs.workers) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Independently use the same shared skills
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          node src/shared-skill-cloud.mjs --self-test
          node src/shared-skill-cloud.mjs agent "$WORKER" "research csv" > "$RUNNER_TEMP/context.json"
          node src/shared-skill-cloud.mjs run protocol-analysis --self-test
          printf 'id,name\n001,Test\n' > "$RUNNER_TEMP/input.csv"
          node src/shared-skill-cloud.mjs run tabular-conversion csv-to-json "$RUNNER_TEMP/input.csv" "$RUNNER_TEMP/output.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1])
          assert json.loads((p/'output.json').read_text())==[{'id':'001','name':'Test'}]
          j=json.loads((p/'context.json').read_text())
          assert len(j['skills'])==4
          assert j['mission']['id']==j['worker']
          assert j['decision']['liveExecutionAuthorized'] is False
          assert all(x['worker']==j['worker'] for x in j['ownObservations'])
          print('SHARED_WORKER_EXECUTED_TWO_SKILLS',j['worker'],[(x['id'],x['sha256']) for x in j['skills']])
          PY
  collect:
    needs: cross-worker
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
      actions: read
    steps:
      - name: Synchronize durable shared observations from real clone runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          root='https://api.github.com/repos/ilhamraduanbis-source/toyol-digital'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'ToyolSkillCloud'}
          def api(path,method='GET',body=None):
              req=urllib.request.Request(root+path,headers={**headers,**({'Content-Type':'application/json'} if body else {})},method=method,data=json.dumps(body).encode() if body else None)
              with urllib.request.urlopen(req,timeout=15) as r:
                  raw=r.read(5000001)
                  if len(raw)>5000000:raise ValueError('response limit')
                  return json.loads(raw)
          file='/contents/runner/shared-memory.json'
          old=api(file+'?ref=main')
          memory=json.loads(base64.b64decode(old['content']))
          assert memory['version']==1 and isinstance(memory['observations'],list)
          seen={x['runId'] for x in memory['observations']}
          cfg=api('/contents/runner/clone-missions.json?ref=main')
          missions=json.loads(base64.b64decode(cfg['content']))['missions']
          registry={m['id']:m['workflow'] for m in missions}
          assert len(registry)==len(missions) and 0<len(registry)<=20
          # Preserve historical and common skill observations as well.
          registry.update({'raptorx':'toyol-raptorx-research.yml','protocol-analysis':'toyol-protocol-analysis-skill.yml','ai-model-development':'toyol-agent-ai.yml'})
          added=[]
          for worker,name in registry.items():
              try:
                  rows=api('/actions/workflows/'+name+'/runs?branch=main&status=completed&per_page=3')['workflow_runs']
                  for run in reversed(rows):
                      rid=run['id']
                      if rid in seen or run['status']!='completed' or run.get('head_branch')!='main':continue
                      jobs=api('/actions/runs/'+str(rid)+'/jobs?per_page=30')['jobs']
                      # Only bounded status metadata. Never collect logs, prompts, credentials, or raw customer data.
                      failed=[s['name'][:140] for j in jobs for s in j.get('steps',[]) if s.get('conclusion')=='failure'][:6]
                      skipped=[s['name'][:140] for j in jobs for s in j.get('steps',[]) if s.get('conclusion')=='skipped'][:6]
                      outcome=run.get('conclusion') or 'unknown'
                      lesson='Inspect failed step before retry; change approach instead of duplicating work.' if failed else 'Workflow completion alone does not establish delivery, acceptance, or payment.'
                      if worker=='aggregator' and failed:lesson='Check real free-provider response and native session evidence before another build. Never fabricate transcripts or repeat paid requests.'
                      if worker=='raptorx':lesson='Verify actual platform report controls and report output, not browser exit code. Stop on ambiguous controls or cost gates.'
                      added.append({'worker':worker,'runId':rid,'attempt':run.get('run_attempt',1),'completedAt':run['updated_at'],'sourceCommit':run['head_sha'],'conclusion':outcome,'failedSteps':failed,'skippedSteps':skipped,'lesson':lesson,'incomeInferred':False})
                      seen.add(rid)
              except Exception as e:print('SOURCE_UNAVAILABLE',worker,type(e).__name__)
          if added:
              memory['observations']=sorted(memory['observations']+added,key=lambda x:(x['completedAt'],x['runId']))[-120:]
              raw=(json.dumps(memory,indent=2,ensure_ascii=True)+'\n').encode()
              api(file,'PUT',{'message':'Sync shared Toyol clone observations (no income claim)','content':base64.b64encode(raw).decode(),'sha':old['sha'],'branch':'main'})
          print('SHARED_MEMORY_SYNC',json.dumps({'newObservations':len(added),'total':len(memory['observations']),'workers':len(registry),'incomeInferred':False}))
          PY
