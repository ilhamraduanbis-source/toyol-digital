name: Toyol — Live $50+ Cash Opportunity Reality Scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/toyol-real-cash50.mjs'
      - 'test/toyol-real-cash50.test.mjs'
      - '.github/workflows/toyol-real-cash50.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: toyol-real-cash50-scout
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify selector rejects imaginary currency and pay-to-qualify bait
        run: |
          node --check src/toyol-real-cash50.mjs
          node --test test/toyol-real-cash50.test.mjs
      - name: Independently qualify current cash listings against primary issue metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/toyol-real-cash50.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toyol-cash50-vetted-candidates
          path: out/real-cash50.json
          retention-days: 7
          if-no-files-found: error
