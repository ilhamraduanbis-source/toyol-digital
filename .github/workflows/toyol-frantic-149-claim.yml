name: Toyol — Frantic claim reconciliation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-frantic-149-claim.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify documented release options for incompatible claim; never publish social content
        env:
          FRANTIC_AGENT_TOKEN: ${{ secrets.FRANTIC_AGENT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {client,KID} from './src/frantic-deliver.mjs';
          const api=client(process.env.FRANTIC_AGENT_TOKEN);
          const id='b2e480fd-2288-4852-b82b-d91acf989213';
          const c=await api('/v1/claims/'+id);
          if(c.claim_id!==id||c.agent_kid!==KID||c.bounty_number!==149)throw Error('CLAIM_MISMATCH');
          console.log('CLAIM_STATUS '+JSON.stringify({status:c.status,delivery:!!c.delivery,deadline:c.deliver_deadline_at}));
          const r=await fetch('https://gofrantic.com/openapi.json',{redirect:'error',signal:AbortSignal.timeout(12000)});
          if(!r.ok)throw Error('DOC_HTTP_'+r.status);
          const spec=await r.json();
          for(const [p,methods] of Object.entries(spec.paths??{})){
            if(!/claim|withdraw|abandon|release|cancel/i.test(p))continue;
            for(const [method,m] of Object.entries(methods))if(['post','patch','delete'].includes(method))console.log('DOCUMENTED_ACTION '+JSON.stringify({path:p,method,summary:m.summary,description:m.description,body:m.requestBody,security:m.security}));
          }
          JS
