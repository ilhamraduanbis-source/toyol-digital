name: Toyol — Self-Owned Vesting Mathematics Skill QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toyol-vesting-skill-ci.yml'
      - 'skills/token-contract-lab/vesting-engine.mjs'
      - 'skills/token-contract-lab/vesting-engine.test.mjs'
permissions:
  contents: read
jobs:
  test:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Test deterministic vesting computation, no APIs or wallets
        run: |
          node --check skills/token-contract-lab/vesting-engine.mjs
          node --test skills/token-contract-lab/vesting-engine.test.mjs
