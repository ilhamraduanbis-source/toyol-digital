name: Toyol — Battle Cup and new cash venue watch
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-battle-cash-watch.yml']
permissions:
  contents: read
concurrency:
  group: toyol-battle-cash-watch
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check actual competitive progress and public buyer inventory
        run: |
          node --input-type=module <<'JS'
          const emit=(k,v)=>console.log(k+' '+JSON.stringify(v));
          async function get(url){const r=await fetch(url,{headers:{Accept:'application/json','User-Agent':'ToyolDigital/1.0'},redirect:'error',signal:AbortSignal.timeout(18000)});if(!r.ok)throw Error('HTTP_'+r.status);return r.json()}
          const bot='toyol-digital-armor',cup='promotedby-cup-nov-2026';
          await Promise.all([
            (async()=>{try{
              const j=await get('https://settled.tools/v1/income/venues');
              const rows=Array.isArray(j)?j:j.venues??j.data;
              if(!Array.isArray(rows))throw Error('VENUE_EVIDENCE_SCHEMA');
              const paying=rows.filter(x=>x.agents_allowed==='yes'&&x.site_status==='up'&&x.verdict==='paying'&&Number(x.onchain_payouts?.payouts_7d)>0);
              emit('RECENT_SETTLEMENT_EVIDENCE',{venues:paying.map(x=>({venue:x.slug,payouts7d:x.onchain_payouts.payouts_7d,paid7d:x.onchain_payouts.paid_usd_7d,lastPayout:x.onchain_payouts.last_payout_at,source:x.url})),source:'https://settled.tools/v1/income/venues',note:'Third-party observed market payments, not Toyol income or guarantee of job availability'});
            }catch(e){emit('SETTLEMENT_EVIDENCE_UNAVAILABLE',{reason:String(e.message).slice(0,100)})}})(),
            (async()=>{try{
              const b=await get('https://api.battle.training/api/bots/'+bot);
              const c=await get('https://api.battle.training/api/ladders/'+cup);
              const row=c.standings?.find(x=>x.bot===bot),v=b.versions?.find(x=>x.active);
              if(b.name!==bot||!row)throw Error('BOT_OR_ENTRY_NOT_FOUND');
              emit('BATTLE_CUP_OBSERVED',{rank:row.rank,sets:row.games,wins:row.wins,losses:row.losses,draws:row.draws,qualified:row.qualified,setsToQualify:row.sets_to_qualify,participants:c.enrolled,cupStatus:c.status,version:v?.label,health:v?.health,publicLadder:b.theaters?.armor,advertisedPrizeUsd:row.prize_usd??null,paymentVerified:false});
            }catch(e){emit('BATTLE_UNAVAILABLE',{reason:String(e.message).slice(0,100)})}})(),
            ...[
              ['moltjobs','https://api.moltjobs.io/v1/jobs?status=OPEN&limit=50'],
              ['taskbounty','https://www.task-bounty.com/api/v1/tasks'],
              ['wenrwa','https://api.wenrwa.com/api/v1/bounties?status=open&limit=50'],
              ['agentbadge','https://agentbadge.xyz/api/venue/jobs'],
              ['bountybook','https://api.bountybook.ai/jobs?status=open&limit=50'],
              ['taskmarket','https://api.taskmarket.dev/api/tasks?status=open&chainId=8453&limit=50'],
              ['frantic','https://gofrantic.com/v1/board'],
              ['swarmmemo','https://swarmmemo.com/api/works?kind=rewarded&limit=100']
            ].map(async([venue,url])=>{try{
              const j=await get(url),d=j.data??j;
              const rows=Array.isArray(d)?d:d.board?.open_bounties??d.bounties??d.tasks??d.jobs??d.works??[];
              if(!Array.isArray(rows))throw Error('UNKNOWN_SCHEMA');
              const open=rows.filter(x=>!['closed','completed','cancelled','settled','resolved','delivered'].includes(String(x.status??x.work_status??x.state).toLowerCase()));
              if(venue==='moltjobs') {
                const buyer=open.filter(x=>x.purpose==='MARKETPLACE');
                const funded=buyer.filter(x=>x.funded===true&&typeof x.escrowTxHash==='string'&&/^0x[0-9a-f]{64}$/i.test(x.escrowTxHash));
                emit('MOLTJOBS_FUNDING_GATE',{buyerJobs:buyer.length,funded:funded.length,unfunded:buyer.length-funded.length,advertisedUsdc:buyer.reduce((sum,x)=>sum+Number(x.budgetUsdc||0),0),fundedJobs:funded.map(x=>({id:x.id,title:x.title,reward:x.budgetUsdc,escrowTxHash:x.escrowTxHash,requiredPackId:x.requiredPackId})),paymentVerified:false});
                return;
              }
              if(venue==='bountybook') {
                const funded=open.filter(x=>typeof x.contract_job_id==='string'&&/^[1-9][0-9]*$/.test(x.contract_job_id)&&typeof x.escrow_tx_hash==='string'&&/^0x[0-9a-f]{64}$/i.test(x.escrow_tx_hash));
                emit('BOUNTYBOOK_ESCROW_GATE',{listed:open.length,possibleFunded:funded.length,requiresChainVerification:true,paymentVerified:false});
                if(!funded.length)return;
              }
              if(venue==='swarmmemo'){
                const cash=open.filter(x=>x.standing?.tiers?.some(t=>Number(t.usdc)>0)||x.reward?.unit==='USDC');
                emit('SWARMMEMO_CASH_GATE',{listed:open.length,cash:cash.length,creditOnly:open.length-cash.length,paymentVerified:false});
                if(!cash.length)return;
              }
              emit('VENUE_OBSERVED',{venue,count:open.length,source:url});
              for(const x of open.slice(0,50)){
                const title=String(x.title??x.name??''),desc=String(x.description??x.request??x.note??'');
                const incompatible=/\b(social media|twitter|tweet|public post|deposit|fund it|buy a|stake required|first-timers only|first-timer|cashback|rebate)\b/i.test(title+' '+desc);
                const reward=x.budgetUsdc??x.reward_usdc??x.price_usd??x.reward??x.budget_usdc??null;
                emit('CANDIDATE_OBSERVED',{venue,id:x.id??x.jobId??x.number,title:title.slice(0,160),reward,description:desc.slice(0,1200),incompatible,eligibility:'REQUIRES_ORIGINAL_TERMS_AND_FUNDING_VERIFICATION',paymentVerified:false});
              }
            }catch(e){emit('VENUE_UNAVAILABLE',{venue,reason:String(e.message).slice(0,100)})}})
          ]);
          JS
