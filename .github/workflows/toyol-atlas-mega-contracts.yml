name: Toyol Atlas — USD5M civil software contract scout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/mega-contract-scout.py'
      - '.github/workflows/toyol-atlas-mega-contracts.yml'
  schedule:
    - cron: '23 */12 * * *'
permissions:
  contents: read
concurrency:
  group: toyol-atlas-mega-contracts
  cancel-in-progress: false
jobs:
  scout:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Discover official notices and validate dollar estimates
        run: python3 src/mega-contract-scout.py ted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atlas-mega-contracts
          path: out/mega-contracts.json
          retention-days: 30
          if-no-files-found: error
