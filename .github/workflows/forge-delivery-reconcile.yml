name: Toyol — Delivery Reconciliation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/forge-delivery-reconcile.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: |
          node --input-type=module <<'JS'
          const root='https://agent-forge-hb.fly.dev/v1/repos/mech-market',wallet='0xac57ad3c3f233e5865c3cd652f67ffc82a7af431',handle='self.toyol-digital-2c74870116';
          async function get(u){const r=await fetch(u,{signal:AbortSignal.timeout(12000),redirect:'error'});if(!r.ok)throw Error('HTTP_'+r.status);return r.json();}
          for(const [item,id] of [['captain-bot','0x4860b150720fbe92ab2b363d7ebf43b466f7ab24c4adbaaa70d3934486fcd03b'],['signature-verifier','0xe36dd58721b4a02ba604ae74c51bd962d1a84c16eb5df055f1d3bd70718872a8'],['public-read-routes','0xc9d80a80d7261661525fd1bd2c0da46df186b59df10f4a4fc61dcb37fa4b3ca8'],['live-scheduler','0xe8de95e4bed8d1aa1931a5a5ef7a6aa5aae04c4004beeacc80a3afdcadaacf6c'],['team-panels','0xa2299f114c5dd9cbcf309b0be813e7a48ae2ddef3ca793168df02625243a889e']]){
            try{
              const t=await get('https://api.taskmarket.dev/api/tasks/'+id),p=await get(root+'/packets/'+item),a=t.task??t,w=p.work?.find(x=>x.id===id),rows=await get('https://api.taskmarket.dev/api/tasks/'+id+'/submissions?chainId=4217');
              const own=rows.filter(x=>String(x.workerAddress??'').toLowerCase()===wallet).map(x=>({id:x.id,rejectedAt:x.rejectedAt,text:x.text??x.content??null}));
              console.log('RECONCILE '+JSON.stringify({item,status:a.status,main:p.main,available:w?.available,waiting:p.task_packet?.[0]?.waiting_on,free:a.pendingActions?.find(x=>x.role==='worker'&&x.action==='submit')?.requiresPayment,count:a.submissionCount,awardCount:a.awardCount??null,matchingAwards:(a.awards??[]).filter(z=>String(z.workerAddress??z.worker??'').toLowerCase()===wallet).map(z=>({submissionId:z.submissionId,status:z.status,settlementTxHash:z.settlementTxHash})),own}));
              const c=await get(root+'/checks?task='+id),list=Array.isArray(c)?c:c.checks??c.results??[];
              const matches=Array.isArray(list)?list.filter(x=>[x.handle,x.agent,x.author,x.worker,x.worker_handle,x.agent_handle].includes(handle)||JSON.stringify(x).includes(handle)):[];
              console.log('FORGE_CHECKS '+JSON.stringify({item,keys:Object.keys(c),total:list.length,matches:matches.map(x=>({commit:x.commit,handle:x.handle??x.agent,code:x.code,status:x.status,passed:x.passed,check:x.check_url??x.url}))}));
            }catch(e){console.log('UNAVAILABLE '+item+' '+e.message);}
          }
          JS
