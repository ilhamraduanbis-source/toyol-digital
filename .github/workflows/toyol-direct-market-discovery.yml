name: Toyol — Direct marketplace work discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-direct-market-discovery.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read live buyer jobs and funded work without registration or spending
        run: |
          node --input-type=module <<'JS'
          const urls=[
            ['dealwork','https://api.dealwork.ai/api/v1/jobs?status=open,bidding&per_page=50&sort=newest&eligible_worker_types=ai_only,any'],
            ['dealwork-open','https://api.dealwork.ai/api/v1/jobs?status=open&per_page=50&sort=newest'],
            ['synmerco','https://synmerco-escrow.onrender.com/v1/jobs'],
            ['agentizable','https://api.agentizable.ai/v1/base/autonomous-bounties/feed?network=base-mainnet&claimable_only=true'],
            ['hober','https://api.hober.dev/api/marketplace/jobs']
          ];
          await Promise.all(urls.map(async([name,url])=>{
            try{
              const r=await fetch(url,{headers:{Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(18000)}),j=await r.json(),d=j.data??j;
              const rows=Array.isArray(d)?d:d.jobs??d.items??d.bounties??d.results??[];
              console.log('MARKET '+JSON.stringify({name,status:r.status,keys:Object.keys(j),meta:j.meta??null,count:rows.length}));
              for(const x of rows.slice(0,50)){
                const title=x.title??x.name??'',desc=String(x.description??x.brief??x.terms??'');
                if(/for hire|i sell|i offer|my service|this is my offer|looking for clients|cashback|rebate|fund a child|funded by you/i.test(title+' '+desc.slice(0,500)))continue;
                console.log('BUYER_JOB '+JSON.stringify({name,id:x.id??x.jobId??x.bounty_contract??x.contract,title,description:desc.slice(0,5000),status:x.status??x.state,mode:x.jobMode??x.job_mode??x.mode,worker:x.eligibleWorkerTypes??x.eligible_worker_types,budget:x.fixedPrice??x.fixed_price??x.budgetMax??x.budget_max??x.reward,criteria:x.acceptanceCriteria??x.acceptance_criteria,slots:x.maxConcurrent??x.max_concurrent,remaining:x.availableSlots??x.available_slots,escrow:x.escrow??x.funded??x.escrow_status,bids:x.bidCount??x.bid_count??x._count?.bids,deadline:x.deadline??x.biddingDeadline??x.bidding_deadline,fields:Object.keys(x)}).slice(0,13000))
              }
            }catch(e){console.log('MARKET_UNAVAILABLE '+JSON.stringify({name,error:String(e.message).slice(0,140)}))}
          }));
          JS

      - name: Verify exact Synmerco job, full price and funding; inspect unfiltered DealWork inventory
        run: |
          node --input-type=module <<'JS'
          for(const [name,url] of [['synmerco','https://synmerco-escrow.onrender.com/v1/jobs'],['dealwork','https://api.dealwork.ai/api/v1/jobs?per_page=50&sort=newest'],['dealwork-schema','https://api.dealwork.ai/openapi.json']]){
            try{
              const r=await fetch(url,{headers:{Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(18000)}),j=await r.json();
              if(name==='dealwork-schema'){console.log('JOB_QUERY_SCHEMA '+JSON.stringify(j.paths?.['/jobs']?.get?.parameters??j.paths?.['/api/v1/jobs']?.get?.parameters??[]).slice(0,12000));continue;}
              const rows=j.jobs??j.data?.jobs??j.data??[];
              console.log('EXACT_MARKET '+JSON.stringify({name,status:r.status,meta:j.meta,error:j.error,count:rows.length}));
              if(name==='synmerco'){for(const x of rows)console.log('SYNMERCO_EXACT '+JSON.stringify(x).slice(0,25000));continue;}
              for(const x of rows){console.log('DEALWORK_EXACT '+JSON.stringify({id:x.id,title:x.title,description:String(x.description??'').slice(0,1600),status:x.status,mode:x.jobMode??x.job_mode,budget:x.fixedPrice??x.budgetMax??x.budget_max,bids:x.bidCount??x._count?.bids,worker:x.eligibleWorkerTypes??x.eligible_worker_types,fields:Object.keys(x)}).slice(0,4000))}
            }catch(e){console.log('EXACT_UNAVAILABLE '+name+' '+String(e.message).slice(0,140))}
          }
          JS

      - name: Distinguish real buyer inventory and inspect exact remaining slots
        run: |
          node --input-type=module <<'JS'
          const root='https://api.dealwork.ai/api/v1';
          async function get(p){const r=await fetch(root+p,{headers:{Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(15000)});const j=await r.json();return {status:r.status,j}}
          try{
            const {status,j}=await get('/jobs/fbef436b-e3d7-4ab9-8157-1e9ad999ec02'),x=j.data?.job??j.data??j;
            console.log('DEALWORK_SLOT_DETAIL '+JSON.stringify({status,id:x.id,remainingSlots:x.remainingSlots,activeClaims:x.activeClaims,claimStateBreakdown:x.claimStateBreakdown,posterType:x.posterType,posterBuyerStats:x.posterBuyerStats,sourceType:x.sourceType,onePerWorker:x.onePerWorker,budget:x.fixedPrice}));
            for(let page=1;page<=3;page++){
              const {status,j}=await get('/jobs?per_page=50&sort=newest&page='+page);const rows=j.data??[];
              console.log('BUYER_PAGE '+JSON.stringify({page,status,count:rows.length}));
              for(const x of rows){
                if(!['posted','bidding','open'].includes(x.status)||x.eligibleWorkerTypes==='human_only'||/\b(for hire|i sell|i offer|i deliver|what i (?:do|deliver|sell|offer)|my services|services i offer|i am (?:grok|an autonomous)|autonomous (?:ai|agent)|my offering|buy my|hiring me)\b/i.test((x.title??'')+' '+String(x.description??'').slice(0,900)))continue;
                console.log('POSSIBLE_REAL_BUYER '+JSON.stringify({id:x.id,title:x.title,description:String(x.description??'').slice(0,2000),status:x.status,mode:x.jobMode,price:x.fixedPrice??x.budgetMax,remaining:x.remainingSlots,claims:x.activeClaims,sourceType:x.sourceType,poster:x.posterDisplayName,stats:x.posterBuyerStats,created:x.createdAt}).slice(0,5000));
              }
            }
          }catch(e){console.log('BUYER_CHECK_STOP '+String(e.message).slice(0,100))}
          JS
