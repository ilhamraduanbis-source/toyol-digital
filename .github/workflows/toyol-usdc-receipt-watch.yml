name: Toyol — Verified USDC Receipt Watch
on:
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/toyol-usdc-receipt-watch.yml'
      - 'src/swarmmemo-payout-observer.py'
      - 'src/taskmarket-forge-watch.mjs'
permissions:
  contents: read
  issues: write
concurrency:
  group: toyol-verified-usdc-receipts
  cancel-in-progress: false
jobs:
  watch-real-payments:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check syntax
        run: python3 -m py_compile src/swarmmemo-payout-observer.py
      - name: Verify public Base transaction evidence and notify only on new payment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 src/swarmmemo-payout-observer.py

      - name: Track confirmed Taskmarket Forge entry (public read only)
        if: always()
        run: node src/taskmarket-forge-watch.mjs

      - name: Record RM400 mission checkpoint (no revenue inference)
        if: always()
        run: |
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          import json
          start = datetime.fromisoformat("2026-11-13T10:49:00+08:00")
          first = start + timedelta(hours=48)
          now = datetime.now(timezone.utc)
          extension = max(0, int((now-first).total_seconds() // 86400)+1) if now >= first else 0
          checkpoint = first + timedelta(days=extension)
          print("MISSION_CHECKPOINT " + json.dumps({
              "target_myr": 400,
              "original_checkpoint_myt": first.isoformat(),
              "current_checkpoint_myt": checkpoint.isoformat(),
              "extension_days_if_target_unmet": extension,
              "policy": "Continue and diversify if target unmet; no reset of verified receipts",
              "accounting": "Separate verified chain receipts, net MYR equivalents and actual MYR cashout; this clock is not payment evidence."
          }))
          PY
