name: Toyol — Verified USDC Receipt Watch
on:
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/toyol-usdc-receipt-watch.yml'
      - 'src/swarmmemo-payout-observer.py'
permissions:
  contents: read
  issues: write
concurrency:
  group: toyol-verified-usdc-receipts
  cancel-in-progress: false
jobs:
  watch-real-payments:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check syntax
        run: python3 -m py_compile src/swarmmemo-payout-observer.py
      - name: Verify public Base transaction evidence and notify only on new payment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 src/swarmmemo-payout-observer.py
