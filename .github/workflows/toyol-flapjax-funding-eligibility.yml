name: Toyol — Q98 first-funder and eligibility gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-flapjax-funding-eligibility.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify exact known funding receipts, public age evidence and uncovered eligibility
        run: |
          node --input-type=module <<'JS'
          const root='https://api.taskmarket.dev',wallet='0xac57ad3c3f233e5865c3cd652f67ffc82a7af431',task='0xf630cc3f1929d42a6225a1365498a194d5ddb658f0bf9f356bbe825c7fd05dc7';
          const emit=(k,v)=>console.log(k+' '+JSON.stringify(v));
          async function get(u,opts={}){const r=await fetch(u,{...opts,redirect:'error',signal:AbortSignal.timeout(12000),headers:{Accept:'application/json',...(opts.headers??{})}});if(!r.ok)throw Error('HTTP_'+r.status);return r.json()}
          async function rpc(method,params){for(const u of ['https://bsc-rpc.publicnode.com','https://bsc.drpc.org'])try{const j=await get(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});if(j.error||j.result==null)throw Error('RPC');return j.result}catch{}throw Error(method)}
          const leads=[
          {recipient:'0xfb200657f7266157a45dfcc6c09690726daa24e6',hash:'0xa3d7042983f4f2352b9b8f324414688db10887e2b2b2a125deca9a8bec6624e7',type:'direct'},
          {recipient:'0x86545df67ec0f718fb5816cfd859a08f90d79f11',hash:'0x25b5f027f7dd0844f48aa05db43906df07a5eb43caa2207be692009836b40a94',type:'system'},
          {recipient:'0x7c34e9e21ee28a49ff0b84b61774119e6633359f',hash:'0xe0f7aeeedd38558ba63a596b8eb6b73e53af63d6282fc3e370160f3b2109bfd0',type:'direct'}];
          for(const x of leads){try{const [t,r]=await Promise.all([rpc('eth_getTransactionByHash',[x.hash]),rpc('eth_getTransactionReceipt',[x.hash])]);if(r.status!=='0x1'||t.hash!==x.hash)throw Error('BAD_RECEIPT');const matched=x.type==='direct'?t.to?.toLowerCase()===x.recipient&&BigInt(t.value)>0n:r.logs.some(l=>l.address.toLowerCase()==='0x0000000000000000000000000000000000001004'&&[...l.topics,l.data].some(z=>z.toLowerCase().includes(x.recipient.slice(2))));emit('FUNDING_RECEIPT',{...x,from:t.from,to:t.to,valueWei:BigInt(t.value).toString(),block:Number(BigInt(t.blockNumber)),matched,systemLogs:x.type==='system'?r.logs.map(l=>({address:l.address,topics:l.topics,data:l.data})):undefined});}catch(e){emit('FUNDING_STOP',{hash:x.hash,error:e.message})}}
          const stats=await get(root+'/api/agents/stats?address='+wallet);
          emit('AGENT_STATS',{agentId:stats.agentId,actorType:stats.actorType,createdAt:stats.createdAt??stats.registeredAt??null,completedTasks:stats.completedTasks});
          const t=(await get(root+'/api/tasks/'+task)).task;
          emit('TASK_STATUS',{status:t?.status,expiry:t?.expiryTime,submissions:t?.submissionCount,awards:t?.awardCount,accepted:t?.awards?.map(x=>({submissionId:x.submissionId,status:x.status,workerAddress:x.workerAddress}))});
          try{const s=await get(root+'/api/tasks/'+task+'/submissions?chainId=8453');emit('PUBLIC_SUBMISSIONS',{count:s.length,own:s.filter(x=>x.workerAddress?.toLowerCase()===wallet).length,accepted:s.filter(x=>x.acceptedAt||x.status==='accepted').map(x=>({id:x.id,workerAddress:x.workerAddress,acceptedAt:x.acceptedAt,content:String(x.content??x.description??x.message??'').slice(0,2000)})),fields:Object.keys(s[0]??{})})}catch(e){emit('SUBMISSION_READ_STOP',{reason:e.message})}
          // Public documented explorer interfaces, no CAPTCHA bypass, no credentials.
          for(const u of ['https://bsc.blockscout.com/api/v2/addresses/0x75ca85a045b6648b31e335bc9742efebcaf778b4/transactions?filter=to','https://api.routescan.io/v2/network/mainnet/evm/56/etherscan/api?module=account&action=txlist&address=0x75ca85a045b6648b31e335bc9742efebcaf778b4&startblock=0&endblock=999999999&sort=asc&page=1&offset=20','https://api.bscscan.com/api?module=account&action=txlist&address=0x75ca85a045b6648b31e335bc9742efebcaf778b4&sort=asc&page=1&offset=10'])try{const j=await get(u);emit('HISTORY_SOURCE',{url:u,status:j.status,message:j.message,items:Array.isArray(j.items)?j.items.slice(0,3):Array.isArray(j.result)?j.result.slice(0,3):j.result,keys:Object.keys(j)})}catch(e){emit('HISTORY_SOURCE_STOP',{url:u,reason:e.message})}
          JS
