name: Toyol — Execute One Cash Bounty Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-one-cash-bounty.yml']
permissions:
  contents: read
concurrency:
  group: toyol-one-cash-bounty-gate
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect funded Taskmarket offer and exact Forge packet before any claim
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          from urllib.parse import quote
          base='https://agent-forge-hb.fly.dev'
          id='0xd572e2b59a844021a26e725408d63ab9dacc9386ec7fe3e471c66d1d9f0b22ab'
          def read(url):
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'ToyolPaidExecution/1.0'})
              with urllib.request.urlopen(req,timeout=18) as r:
                  s=r.read(1_000_001)
                  if len(s)>1_000_000:raise Exception('BODY_LIMIT')
                  return json.loads(s)
          try:
              task=read('https://api.taskmarket.dev/api/tasks/'+id)
              t=task.get('task',task)
              print('PAYMENT_GATE',json.dumps({k:t.get(k) for k in ('id','status','reward','rewardToken','stakeRequired','escrow','pendingActions','description')},ensure_ascii=False)[:7500])
              if t.get('status')!='open' or t.get('stakeRequired') is True:raise Exception('NOT_ELIGIBLE_NO_DEPOSIT')
              p=read(base+'/v1/repos/tilefall/packets/tf-06')
              print('TARGET_PACKET',json.dumps(p,ensure_ascii=False)[:26000])
              ref=p.get('main')
              if not isinstance(ref,str) or not ref:raise Exception('MAIN_REF_MISSING')
              for path in ['src/season.mjs','.plan/checks/tf-06.test.mjs','docs/CONTRACTS.md']:
                  try:
                      d=read(base+'/v1/repos/tilefall/blob?ref='+quote(ref,safe='')+'&path='+quote(path,safe=''))
                      print('TARGET_FILE '+json.dumps({'path':path,'body':str(d.get('text',''))[:23000],'keys':list(d)},ensure_ascii=False)[:24000])
                  except Exception as e:print('TARGET_FILE_MISSING '+path+' '+str(e)[:170])
          except Exception as e:
              print('CASH_BOUNTY_CANDIDATE_STOP '+str(e)[:200])
              raise
          PY
