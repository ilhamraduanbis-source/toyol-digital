name: Toyol — Go-Hybrid 4488 official verdict watch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-go-hybrid-4488-watch.yml']
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: read
concurrency:
  group: toyol-go-hybrid-4488-watch
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read official issue and public milestone ledger without posting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const root='https://api.github.com/repos/limitlessprojects/Go-Hybrid';
          const h={Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',Authorization:'Bearer '+process.env.GH_TOKEN,'User-Agent':'ToyolVerdictWatch'};
          const get=async p=>{const r=await fetch(root+p,{headers:h,redirect:'error',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('HTTP_'+r.status);return r.json()};
          try{
            const issue=await get('/issues/4488');
            if(issue.user?.login!=='ilhamraduanbis-source'||!issue.title.includes('Publication-authority regions'))throw Error('ISSUE_IDENTITY_MISMATCH');
            const comments=await get('/issues/4488/comments?per_page=100');
            if(!Array.isArray(comments)||issue.comments>100)throw Error('COMMENT_PAGINATION_REVIEW_REQUIRED');
            const ledger=await get('/contents/MOONSHOT.md');
            const lines=Buffer.from(ledger.content,'base64').toString('utf8').split('\n');
            const entries=lines.filter(s=>s.startsWith('| W-')&&/(?:#4488\b|issues\/4488\b)/.test(s));
            const official=comments.filter(c=>['OWNER','MEMBER','COLLABORATOR'].includes(c.author_association)).map(c=>({author:c.user.login,association:c.author_association,url:c.html_url,createdAt:c.created_at,body:c.body.slice(0,4000)}));
            const contributor=comments.filter(c=>c.author_association==='CONTRIBUTOR').map(c=>({author:c.user.login,url:c.html_url,viable:/VERDICT:\s*VIABLE/i.test(c.body)}));
            const x={issue:4488,state:issue.state,labels:issue.labels.map(l=>l.name),url:issue.html_url,officialComments:official,ledgerEntries:entries,contributorReviews:contributor,requiresReview:official.length>0||entries.length>0,verifiedPayment:false,observedAt:new Date().toISOString()};
            fs.mkdirSync('out',{recursive:true});fs.writeFileSync('out/go-hybrid-4488.json',JSON.stringify(x,null,2));
            console.log('HYBRID_4488_STATUS',JSON.stringify({state:x.state,officialComments:official.length,ledgerEntries:entries.length,contributorReviews:contributor,requiresReview:x.requiresReview,verifiedPayment:false}));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Go-Hybrid #4488\n\n[Official issue]('+x.url+')\n\nMaintainer-associated comments: '+official.length+'; matching ledger rows: '+entries.length+'.\n\nContributor verdicts are not an award. Any official milestone or payment requires separate evidence review. No external write or wallet operation.\n');
          }catch(e){console.log('HYBRID_WATCH_UNAVAILABLE',String(e.message).slice(0,160))}
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: go-hybrid-4488-status
          path: out/
          if-no-files-found: ignore
          retention-days: 7
