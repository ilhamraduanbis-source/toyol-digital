name: Toyol — Solana funding preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-solana-funding-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify public wallet funds and free withdrawal challenge independently
        run: |
          node --input-type=module <<'JS'
          const wallet='At7TxA4e81Ai8X2TWZq944NSSbP1HaJB9iRug4vD1uQ',mint='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGkZwyTDt1v';
          const endpoints=['https://api.mainnet-beta.solana.com','https://api.mainnet.solana.com','https://solana-rpc.publicnode.com'];
          const queries=[
            ['getBalance',[wallet,{commitment:'finalized'}]],
            ['getTokenAccountsByOwner',[wallet,{mint},{encoding:'jsonParsed',commitment:'finalized'}]],
            ['getMinimumBalanceForRentExemption',[165]]
          ];
          for(const [method,params] of queries){
            for(const url of endpoints){
              try{
                const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:AbortSignal.timeout(10000),redirect:'error'});
                if(!r.ok){console.log('RPC_HTTP '+method+' '+url+' '+r.status);continue}
                const j=await r.json();if(j.error||j.result===undefined){console.log('RPC_ERROR '+method+' '+JSON.stringify(j.error??null).slice(0,500));continue}
                if(method==='getTokenAccountsByOwner'){
                  const rows=j.result.value.map(x=>{const i=x.account?.data?.parsed?.info;if(i?.owner!==wallet||i?.mint!==mint||i.tokenAmount?.decimals!==6||!/^\d+$/.test(i.tokenAmount.amount))throw Error('ACCOUNT_MISMATCH');return {address:x.pubkey,state:i.state,amountMicros:i.tokenAmount.amount};});
                  console.log('SOLANA_USDC_ACCOUNTS '+JSON.stringify({rpc:url,rows,totalMicros:String(rows.reduce((sum,x)=>sum+BigInt(x.amountMicros),0n))}));
                }else console.log('SOLANA_RPC_RESULT '+JSON.stringify({rpc:url,method,result:j.result}));
                break;
              }catch(e){console.log('RPC_UNAVAILABLE '+method+' '+url+' '+String(e.message).slice(0,160));}
            }
          }
          try{
            const url='https://api.wurk.fun/withdraw/quote',body=JSON.stringify({network:'solana',asset:'USDC'});
            const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body,redirect:'error',signal:AbortSignal.timeout(15000)}),j=await r.json(),x=j.extensions?.['sign-in-with-x'];
            console.log('WURK_QUOTE_CHALLENGE '+JSON.stringify({status:r.status,version:j.x402Version,accepts:j.accepts?.length,statement:x?.info?.statement,domain:x?.info?.domain,uri:x?.info?.uri,resources:x?.info?.resources,fields:Object.keys(x?.info??{}),chains:x?.supportedChains,code:j.errorCode??null}));
          }catch(e){console.log('WURK_QUOTE_CHALLENGE_UNAVAILABLE '+String(e.message).slice(0,100));}
          console.log('READ_ONLY_PREFLIGHT_COMPLETE. No signing, withdrawals, payment or transfer.');
          JS

      - name: Obtain actual zero-charge withdrawal quote from WURK
        env:
          TOYOL_SOLANA_KEYPAIR_JSON: ${{ secrets.TOYOL_SOLANA_KEYPAIR_JSON }}
        run: |
          node --input-type=module <<'JS'
          import {createPrivateKey,createPublicKey,sign,verify} from 'node:crypto';
          const root='https://api.wurk.fun',url=root+'/withdraw/quote',chain='solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp';
          const address='At7TxA4e81Ai8X2TWZq944NSSbP1HaJB9iRug4vD1uQ',body=JSON.stringify({network:'solana',asset:'USDC'});
          const statement='Request a WURK withdrawal fee quote. Method: POST. Intent SHA-256: e182863d68916f6903c37f645cdb3e68945e6847f6874c7a84e441f39ddbe25d';
          const alphabet='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
          function b58(b){let n=0n;for(const x of b)n=n*256n+BigInt(x);let s='';while(n){s=alphabet[Number(n%58n)]+s;n/=58n;}for(const x of b){if(x!==0)break;s='1'+s;}return s;}
          async function post(proof){const r=await fetch(url,{method:'POST',body,redirect:'error',signal:AbortSignal.timeout(18000),headers:{Accept:'application/json','Content-Type':'application/json',...(proof?{'SIGN-IN-WITH-X':proof}:{})}});return {r,j:await r.json()};}
          try{
            const a=JSON.parse(process.env.TOYOL_SOLANA_KEYPAIR_JSON??'null');
            if(!Array.isArray(a)||a.length!==64||!a.every(n=>Number.isInteger(n)&&n>=0&&n<=255))throw Error('KEYPAIR_FORMAT');
            const key=createPrivateKey({key:Buffer.concat([Buffer.from('302e020100300506032b657004220420','hex'),Buffer.from(a.slice(0,32))]),format:'der',type:'pkcs8'});
            const pub=createPublicKey(key),pk=Buffer.from(pub.export({format:'jwk'}).x,'base64url');
            if(b58(pk)!==address||!pk.equals(Buffer.from(a.slice(32))))throw Error('WALLET_IDENTITY');
            delete process.env.TOYOL_SOLANA_KEYPAIR_JSON;
            const {r,j}=await post(),ext=j.extensions?.['sign-in-with-x'],i=ext?.info;
            const supported=ext?.supportedChains?.find(x=>x.chainId===chain&&x.type==='ed25519'&&(!x.signatureScheme||x.signatureScheme==='siws'));
            const now=Date.now(),issued=Date.parse(i?.issuedAt),expires=Date.parse(i?.expirationTime);
            if(r.status!==402||j.x402Version!==2||!Array.isArray(j.accepts)||j.accepts.length!==0||!supported||i?.domain!=='api.wurk.fun'||i.uri!==url||i.statement!==statement||i.version!=='1'||i.resources?.length!==1||i.resources[0]!==url||!/^[A-Za-z0-9]{8,128}$/.test(i.nonce??'')||!Number.isFinite(issued)||!Number.isFinite(expires)||issued>now+5000||issued<now-300000||expires<=now||expires-issued>300000||i.notBefore||i.requestId)throw Error('QUOTE_INTENT_OR_VALIDITY_MISMATCH');
            const message=[i.domain+' wants you to sign in with your Solana account:',address,'',i.statement,'','URI: '+i.uri,'Version: '+i.version,'Chain ID: '+chain.split(':')[1],'Nonce: '+i.nonce,'Issued At: '+i.issuedAt,'Expiration Time: '+i.expirationTime,'Resources:','- '+url].join('\n');
            const sig=sign(null,Buffer.from(message),key);if(!verify(null,Buffer.from(message),pub,sig))throw Error('SIGNATURE_LOCAL');
            const proof={...i,chainId:chain,type:'ed25519',...(supported.signatureScheme?{signatureScheme:supported.signatureScheme}:{}),address,signature:b58(sig)};
            const out=await post(Buffer.from(JSON.stringify(proof)).toString('base64url'));
            const q=out.j.quote??out.j.data?.quote??out.j.data??out.j;
            console.log('WURK_WITHDRAWAL_QUOTE '+JSON.stringify({http:out.r.status,ok:out.j.ok,code:out.j.errorCode??out.j.code??null,network:q.network,asset:q.asset,walletAddress:q.walletAddress,amountGross:q.amountGross,feeAmount:q.feeAmount,amountNet:q.amountNet,requiresAta:q.requiresAta,mint:q.mint,ata:q.ata??q.associatedTokenAccount,expiresAt:q.expiresAt,fields:Object.keys(q),message:typeof out.j.message==='string'?out.j.message.slice(0,200):null}));
            console.log('QUOTE_ONLY. No withdrawal confirmation or payment was sent.');
          }catch(e){console.log('QUOTE_UNAVAILABLE_NO_PAYMENT '+String(e.message).slice(0,160));}
          JS
