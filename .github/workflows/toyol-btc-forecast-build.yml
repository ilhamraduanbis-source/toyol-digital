name: Toyol — BTC forecast build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-btc-forecast-build.yml']
permissions:
  contents: read
concurrency:
  group: toyol-btc-forecast-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Download official public contest kit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/btc-forecast" out
          cd "$RUNNER_TEMP/btc-forecast"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-max-time 75 --max-time 25 https://make.fun/api/competitions/btc-cent-forecast-01/requirements -o requirements.json
          python3 - <<'PY'
          import json,datetime as d
          x=json.load(open('requirements.json')); x=x.get('data',x)
          assert isinstance(x,dict) and isinstance(x.get('how_to_submit'),dict),'REQUIREMENTS_SCHEMA'
          assert not any(p.get('required',True) for p in (x.get('prerequisites') or [])),'REQUIRED_PREREQUISITE_REVIEW'
          assert not x['how_to_submit'].get('strict_transcripts'),'WITNESSED_HARNESS_REQUIRED'
          assert d.datetime.now(d.timezone.utc)<d.datetime(2026,11,15,7,30,tzinfo=d.timezone.utc),'DEADLINE_GUARD'
          print('BTC_FORECAST_PREREQUISITES_VERIFIED')
          PY
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --retry-max-time 100 --max-time 35 https://make.fun/c/btc-cent-forecast-01/kit -o kit.tgz
          python3 - <<'PY'
          import tarfile,pathlib
          with tarfile.open('kit.tgz') as z:
              a=z.getmembers()
              if sum(x.size for x in a)>100000000 or any(x.name.startswith('/') or '..' in pathlib.PurePosixPath(x.name).parts or not(x.isfile() or x.isdir()) for x in a): raise SystemExit('UNSAFE_KIT')
              z.extractall('.',filter='data')
          PY
          npm install --prefix "$RUNNER_TEMP/btc-forecast/tools" --no-audit --no-fund @opencode/cli@2.3.0
          echo "$RUNNER_TEMP/btc-forecast/tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build deterministic forecast with authentic native agent records
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/btc-forecast"
          kit="$root/btc-cent-forecast-01-kit"
          export OPENCODE_DISABLE_AUTOSHARE=true
          export HOME="$root/home"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_STATE_HOME="$HOME/.local/state"
          export XDG_CACHE_HOME="$HOME/.cache"
          mkdir -p "$HOME" "$root/entry" "$GITHUB_WORKSPACE/out"
          out="$GITHUB_WORKSPACE/out"
          timeout 60s opencode models --standalone > "$root/models.txt"
          curl --fail --silent --show-error --max-time 20 https://models.dev/api.json -o "$root/models.json"
          model=$(python3 - "$root" <<'PY'
          import json,sys,re,pathlib
          p=pathlib.Path(sys.argv[1])
          a=set(re.findall(r'opencode/[A-Za-z0-9_.-]+',(p/'models.txt').read_text()))
          d=json.loads((p/'models.json').read_text())['opencode']['models']
          for k in ['mai-code-1.1-flash-free','big-pickle','glm-5.3-flash-free','deepseek-v4.1-flash-free']:
              v=d.get(k,{}).get('cost',{})
              if 'opencode/'+k in a and v.get('input')==0 and v.get('output')==0:
                  print('opencode/'+k);break
          else: raise SystemExit('NO_VERIFIED_FREE_MODEL')
          PY
          )
          echo "BTC_FORECAST_MODEL $model"
          cd "$root/entry"
          node "$kit/cli/makefun.mjs" init --competition btc-cent-forecast-01 --wallet At7TxA4e81Ai8X2TWZq944NSSbP1HaJB9iRug4vD1uQ --license MIT
          python3 - "$model" <<'PY'
          import json,sys
          json.dump({"model":sys.argv[1],"small_model":sys.argv[1],"share":"disabled","autoupdate":False,"permission":{"edit":"allow","read":"allow","bash":"allow","webfetch":"deny","websearch":"deny","external_directory":"allow"}},open('opencode.json','w'))
          PY
          prompt="First run this exact anchor command: node $kit/cli/makefun.mjs init --competition btc-cent-forecast-01 --wallet At7TxA4e81Ai8X2TWZq944NSSbP1HaJB9iRug4vD1uQ --license MIT. Read the official rules and one sample input to determine the actual format. Immediately write main.py: a short, offline Python standard-library program for each /input/<id>.in writing one USD price number to /output/<id>.out. Use the last price plus a conservatively shrunken recent trend (for example 0.15 times the difference between the last price and the price 240 minutes earlier, bounded to a small fraction of price). No hidden data, networking or hardcoded case answers. Write the working file before further analysis. Finish with a brief explanation."
          set +e
          timeout --kill-after=5s 360s opencode run --standalone --model "$model" --format json "$prompt" </dev/null > "$root/session.jsonl" 2> "$root/session.stderr"
          rc=$?
          set -e
          echo "BTC_FORECAST_AGENT_EXIT $rc"
          if ! test -s main.py; then
            echo "NO_SOURCE_FROM_AGENT"
            exit 1
          fi
          test -s main.py
          python3 -m py_compile main.py
          cp main.py "$root/draft.py"
          for revision in 1 2; do
            if [ "$revision" = 1 ]; then
              review="Read main.py. Make one focused improvement to shrink the forecast based on historical volatility and robust recent returns, with no lookahead. Preserve the working input/output format and other code. Test syntax and a synthetic example, explain the change, and finish promptly."
            else
              review="Make one further focused edit to handle malformed or short inputs and finite numeric output correctly. Preserve the algorithm and other code. Run python3 -m py_compile main.py. Explain the result and finish promptly."
            fi
            set +e
            timeout --kill-after=5s 140s opencode run --standalone --continue --model "$model" --format json "$review" </dev/null > "$root/revision-$revision.jsonl" 2> "$root/revision-$revision.stderr"
            revrc=$?
            set -e
            echo "BTC_FORECAST_REVISION_EXIT $revision $revrc"
            test "$revrc" = 0
          done
          if cmp -s "$root/draft.py" main.py; then echo 'NO_REAL_REVISION'; exit 1; fi
          python3 -m py_compile main.py
          git add main.py
          git -c user.name='Toyol Digital' -c user.email='toyol@users.noreply.github.com' commit -qm 'Recorded BTC forecast and genuine revisions'
          node "$kit/cli/makefun.mjs" bundle --repo "$root/entry" --out "$root/transcripts.tar.gz" --opencode-dir "$XDG_DATA_HOME/opencode" --harness opencode --harness-version 2.3.0 --model "$model" --provider opencode
          set +e
          node "$kit/cli/makefun.mjs" check --kit "$kit" --repo "$root/entry" --transcripts "$root/transcripts.tar.gz" --json > "$out/check.json" 2> "$root/check.stderr"
          check_rc=$?
          set -e
          python3 - "$out/check.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          def scan(v):
              if isinstance(v,dict):
                  if 'status' in v and any(k in v for k in ('check','id','name')): print('OFFICIAL_BTC_FORECAST_CHECK',json.dumps({k:v[k] for k in ('check','id','name','status','reason','fix') if k in v}))
                  for w in v.values():scan(w)
              elif isinstance(v,list):
                  for w in v:scan(w)
          scan(x)
          PY
          test "$check_rc" = 0
          cp main.py "$out/main.py"
          git bundle create "$root/source.bundle" HEAD
          printf '%s\n' "$(git rev-parse HEAD)" > "$root/commit.txt"
          python3 -m pip install --disable-pip-version-check --target "$root/crypto" 'PyNaCl==1.5.0'
          PYTHONPATH="$root/crypto" python3 - "$root" "$out" <<'PY'
          import pathlib,sys,tarfile,io
          from nacl.signing import VerifyKey
          from nacl.public import SealedBox
          p=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          alphabet='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
          n=0
          for ch in 'At7TxA4e81Ai8X2TWZq944NSSbP1HaJB9iRug4vD1uQ':
              n=n*58+alphabet.index(ch)
          box=SealedBox(VerifyKey(n.to_bytes(32,'big')).to_curve25519_public_key())
          b=io.BytesIO()
          with tarfile.open(fileobj=b,mode='w:gz') as t:
              for name in ('source.bundle','transcripts.tar.gz','commit.txt'):
                  t.add(p/name,arcname=name)
          (out/'entry.sealed').write_bytes(box.encrypt(b.getvalue()))
          print('BTC_FORECAST_SOURCE_AND_NATIVE_TRANSCRIPTS_PRESERVED')
          PY
          # Run the official local grader if supported, with no model keys.
          unset OPENAI_API_KEY ANTHROPIC_API_KEY OPENROUTER_API_KEY GEMINI_API_KEY
          set +e
          timeout --kill-after=10s 240s node "$kit/cli/makefun.mjs" grade-local --kit "$kit" --bot "$root/entry" --driver docker --json > "$out/grade.json" 2> "$root/grade.stderr"
          grade_rc=$?
          set -e
          if [ "$grade_rc" -ne 0 ]; then
            echo "BTC_FORECAST_GRADE_EXIT $grade_rc"
            python3 - "$root/grade.stderr" "$out/grade.json" <<'PY'
          import pathlib,sys,re
          for name in sys.argv[1:]:
              p=pathlib.Path(name)
              s=p.read_text(errors="replace") if p.exists() else ""
              for line in s.splitlines()[:12]:
                  if len(line)<350 and re.search(r"error|unsupported|not available|missing|required|usage|unknown|driver|grade|practice|fixture",line,re.I):print("GRADE_DIAGNOSTIC",line)
          PY
            exit "$grade_rc"
          fi
          python3 - "$out/grade.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert isinstance(x,(dict,list))
          print('BTC_FORECAST_OFFICIAL_GRADE',json.dumps(x)[:5000])
          PY
          cp main.py "$out/main.py"
          echo 'BTC_FORECAST_OFFICIAL_GRADE_COMPLETED'
      - name: Preserve review evidence (not a submission)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toyol-btc-forecast-entry
          path: out/
          retention-days: 7
          if-no-files-found: ignore
