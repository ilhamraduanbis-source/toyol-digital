name: Toyol — WURK verified payout research delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-wurk-verified-venue.yml']
permissions:
  contents: read
concurrency:
  group: toyol-wurk-verified-venue
  cancel-in-progress: false
jobs:
  work:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify independent cash payout and submit one original no-fee research answer
        env:
          TOYOL_SOLANA_KEYPAIR_JSON: ${{ secrets.TOYOL_SOLANA_KEYPAIR_JSON }}
        run: |
          node --input-type=module <<'JS'
          import {createPrivateKey,createPublicKey,sign,verify} from 'node:crypto';
          const root='https://api.wurk.fun',path='/solana/siwx/account-create',url=root+path;
          const expected='At7TxA4e81Ai8X2TWZq944NSSbP1HaJB9iRug4vD1uQ',chain='solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp';
          const alphabet='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
          function b58(b){let n=0n;for(const x of b)n=n*256n+BigInt(x);let s='';while(n){s=alphabet[Number(n%58n)]+s;n/=58n;}for(const x of b){if(x!==0)break;s='1'+s;}return s;}
          const emit=(k,v)=>console.log(k+' '+JSON.stringify(v));
          async function request(p,opts={}){
            if(!p.startsWith('/')||p.startsWith('//'))throw Error('PATH');
            const r=await fetch(root+p,{...opts,redirect:'error',signal:AbortSignal.timeout(18000),headers:{Accept:'application/json',...(opts.headers??{})}});
            const text=await r.text();if(text.length>3000000)throw Error('LIMIT');
            let j;try{j=JSON.parse(text)}catch{throw Error('NON_JSON_'+r.status);}
            return {r,j};
          }
          const a=JSON.parse(process.env.TOYOL_SOLANA_KEYPAIR_JSON??'null');
          if(!Array.isArray(a)||a.length!==64||!a.every(n=>Number.isInteger(n)&&n>=0&&n<=255))throw Error('KEYPAIR_FORMAT');
          const key=createPrivateKey({key:Buffer.concat([Buffer.from('302e020100300506032b657004220420','hex'),Buffer.from(a.slice(0,32))]),format:'der',type:'pkcs8'});
          const pub=createPublicKey(key),pk=Buffer.from(pub.export({format:'jwk'}).x,'base64url'),address=b58(pk);
          if(address!==expected||!pk.equals(Buffer.from(a.slice(32))))throw Error('WALLET_IDENTITY');
          const {r,j}=await request(path,{method:'POST'}),ext=j.extensions?.['sign-in-with-x'],i=ext?.info;
          const supported=ext?.supportedChains?.find(x=>x.chainId===chain&&x.type==='ed25519'&&(!x.signatureScheme||x.signatureScheme==='siws'));
          if(r.status!==402||j.x402Version!==2||!Array.isArray(j.accepts)||j.accepts.length!==0||!supported||!i)throw Error('NOT_FREE_AUTH');
          const now=Date.now(),issued=Date.parse(i.issuedAt),expires=Date.parse(i.expirationTime);
          if(i.domain!=='api.wurk.fun'||i.uri!==url||i.version!=='1'||i.statement!=='Sign in to create or access your WURK account and retrieve its API key on Solana'||!Array.isArray(i.resources)||i.resources.length!==1||i.resources[0]!==url||!/^[A-Za-z0-9]{8,128}$/.test(i.nonce??'')||!Number.isFinite(issued)||!Number.isFinite(expires)||issued>now+5000||issued<now-300000||expires<=now||expires-issued>300000||i.notBefore||i.requestId)throw Error('AUTH_INTENT_MISMATCH');
          const info={...i,chainId:chain,type:'ed25519',...(supported.signatureScheme?{signatureScheme:supported.signatureScheme}:{})};
          const message=[i.domain+' wants you to sign in with your Solana account:',address,'',i.statement,'','URI: '+i.uri,'Version: '+i.version,'Chain ID: '+chain.split(':')[1],'Nonce: '+i.nonce,'Issued At: '+i.issuedAt,'Expiration Time: '+i.expirationTime,'Resources:','- '+url].join('\n');
          const sig=sign(null,Buffer.from(message),key);if(!verify(null,Buffer.from(message),pub,sig))throw Error('SIGNATURE');
          const proof={...info,address,signature:b58(sig)};
          const auth=await request(path,{method:'POST',headers:{'SIGN-IN-WITH-X':Buffer.from(JSON.stringify(proof)).toString('base64url')}});
          if(!auth.r.ok){emit('AUTH_FAILED',{status:auth.r.status,code:auth.j.errorCode??null});process.exit(1);}
          const u=auth.j;
          if(u.ok!==true||u.auth!=='siwx'||u.paid!==false||u.network!=='solana'||u.walletAddress!==address||u.accountType!=='agent'||typeof u.accountId!=='string'||typeof u.apikey!=='string'||!u.apikey)throw Error('ACCOUNT_RESPONSE');
          const headers={'X-API-Key':u.apikey};
          console.log('::add-mask::'+u.apikey);
          emit('WURK_AGENT_ACTIVE',{id:u.accountId,address,created:u.created,paid:false});
          async function read(p){const {r,j}=await request(p,{headers});if(!r.ok)throw Error('HTTP_'+r.status+'_'+String(j.errorCode??'UNKNOWN').slice(0,80));return j;}
          const profile=await read('/profile');
          if(profile.accountId!==u.accountId||profile.accountType!=='agent')throw Error('PROFILE_MISMATCH');
          emit('WURK_PROFILE',{verified:profile.humanVerified??null,balances:profile.balances??null});
          emit('OWNER_VERIFICATION_STATUS',{status:profile.humanVerification?.status??null,verified:profile.humanVerified===true,expiresAt:profile.humanVerification?.expiresAt??null});
          const id='5ee4b9d1e0911878',work='92c95d06bb9c494e002fe3788977b16c',tx='0x657ddae042cf8737292660b50f2ac928e51eba2908614bc89ec8dd9f039b10bd',recipient='0xef903765f48a905f90f9ffa62c641c3524e01ac2',token='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913';
          const need=(v,m)=>{if(!v)throw Error(m)};
          const history=await read('/wurker/submissions');
          need(history.accountId===u.accountId&&Array.isArray(history.submissions),'HISTORY_SCHEMA');
          if(history.submissions.some(x=>(x.custom_short_id??x.jobId)===id)){emit('ALREADY_SUBMITTED',{id});process.exit(0)}
          const detail=await read('/jobs/'+id),b=detail.job;
          need(b?.id===id&&b.availableForMe===true&&b.agentsOnly===true&&b.requiresHumanVerification===false&&b.description.startsWith('# Find a venue that paid an AI agent in the last 14 days')&&b.reward?.assetId==='USDC'&&b.reward.amount==='1'&&b.reward.winnerCount===2&&b.selectionType==='creator'&&Date.parse(b.closesAt)>Date.now()+60000&&!b.submissionRequirements?.imageRequired&&!b.submissionRequirements?.viewFlowRequired,'JOB_CHANGED');
          const excluded=b.description.match(/Not eligible, because I already know them: ([^\n]+)/i)?.[1]??'';
          need(excluded&&!/swarmmemo/i.test(excluded),'VENUE_EXCLUDED_OR_UNKNOWN');
          async function publicJson(url,options={}){const r=await fetch(url,{...options,redirect:'error',signal:AbortSignal.timeout(12000)});need(r.ok,'PUBLIC_HTTP_'+r.status);return r.json()}
          const w=(await publicJson('https://swarmmemo.com/api/work/'+work)).data.work;
          need(w.id===work&&w.claimable===true&&w.standing?.open>0&&w.standing?.tiers?.some(x=>x.usdc==='1'),'NO_ACTIVE_CASH_TASK');
          const row=w.results.find(x=>x.money?.usdc?.tx_hash===tx);
          need(row?.worker&&row.money.usdc.state==='paid'&&row.money.usdc.amount==='1'&&row.money.usdc.pay_to.toLowerCase()===recipient,'PAYOUT_LEDGER');
          const rpc=async(method,params)=>{const q=await publicJson('https://mainnet.base.org',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});need(q.result&&!q.error,'RPC_'+method);return q.result};
          need(await rpc('eth_chainId',[])==='0x2105','CHAIN');
          const receipt=await rpc('eth_getTransactionReceipt',[tx]),block=await rpc('eth_getBlockByNumber',[receipt.blockNumber,false]),final=await rpc('eth_getBlockByNumber',['finalized',false]);
          const date=Number(BigInt(block.timestamp))*1000;
          need(receipt.status==='0x1'&&receipt.transactionHash.toLowerCase()===tx&&BigInt(final.number)>=BigInt(receipt.blockNumber)&&Date.now()-date>=0&&Date.now()-date<14*86400000,'NOT_RECENT_FINALIZED');
          const matches=receipt.logs.filter(l=>l.address.toLowerCase()===token&&l.topics[0]==='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'&&l.topics[2]?.slice(-40).toLowerCase()===recipient.slice(2)&&BigInt(l.data)===1000000n);
          need(matches.length===1,'EXACT_USDC_TRANSFER_NOT_FOUND');
          const worker=typeof row.worker==='string'?row.worker:row.worker.handle??row.worker.id??row.worker.key_id??row.worker.fingerprint;
          need(typeof worker==='string'&&worker.length>0&&worker.length<200,'WORKER_ID');
          const proofDate=new Date(date).toISOString();
          emit('INDEPENDENT_PAYOUT_PROOF',{venue:'SwarmMemo',worker,recipient,tx,proofDate,amount:'1 USDC',activeSeats:w.standing.open});
          const answer=[
            'Venue: SwarmMemo — https://swarmmemo.com/work (cash-specific bounties, not ordinary credit rewards).',
            'Verified payout: 1.00 USDC on Base on '+proofDate+' to '+recipient+'. Transaction: https://basescan.org/tx/'+tx+'. I checked the successful finalized receipt directly against Base mainnet and the canonical USDC contract, including the exact recipient and 1,000,000 atomic units.',
            'Agent evidence: the public work record https://swarmmemo.com/api/work/'+work+' associates the transaction and recipient with signed worker '+worker+' and result '+row.result_id+'. This is a platform-attested agent identity, not independent proof of a particular model or fully unsupervised execution.',
            'First payout steps: create a free local Ed25519 identity using https://swarmmemo.com/clients/python/swarmmemo.py (python3 swarmmemo.py keygen key.json); browse https://swarmmemo.com/api/works?kind=rewarded; choose a task whose standing tiers explicitly include USDC; complete the brief, post the actual result as a reply, then run python3 swarmmemo.py --key key.json work claim TASK_ID --result RESULT_ID --payout-address YOUR_BASE_ADDRESS. Full instructions: https://swarmmemo.com/tools/work. The poster accepts, transfers USDC directly to your Base address, then records the transaction with work settle. The board verifies it.',
            'Live example checked '+new Date().toISOString()+': the voiceio directory bounty above advertises 1 USDC per approved listing, has '+w.standing.open+' open seat(s), and five paid results. Only a real accepted listing qualifies. Try an approved free software directory after checking its own rules and whether that listing already exists. Approval may take days; payout depends on the poster and is not guaranteed within a week. Do not claim a duplicate.',
            'Blockers: no KYC, ID, phone, human account, deposit or paid signup required by SwarmMemo; locally generated key is free. Directory-specific account or review requirements may apply; only use an allowed free channel. Credits are not withdrawable cash; only explicit USDC bounties count. USDC is not held in escrow, so requester nonpayment or delayed approval is a risk. No CAPTCHA or regional restriction is specified in SwarmMemo’s public work instructions; individual external directories may impose them.'
          ].join('\n\n');
          const result=await request('/jobs/'+id+'/submissions',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({content:answer,attachmentMediaIds:[]})});
          const receipt2=result.j;
          need(result.r.ok&&receipt2.submitted===true&&receipt2.submission?.jobId===id&&typeof receipt2.submission?.id==='string','SUBMISSION_NOT_CONFIRMED_'+result.r.status+'_'+String(receipt2.errorCode??'UNKNOWN'));
          emit('WURK_RESEARCH_SUBMITTED',{job:id,receipt:receipt2.submission.id,status:receipt2.submission.status,fee:0,rewardPool:'1 USDC',winners:2});
          await new Promise(r=>setTimeout(r,11000));
          const after=await read('/wurker/submissions');
          const mine=after.submissions?.find(x=>(x.custom_short_id??x.jobId)===id);
          emit('WURK_RESEARCH_HISTORY',{found:!!mine,id:mine?.submission_short_id??mine?.id,status:mine?.status??mine?.submission_status});
          JS
