name: Toyol — Proven Payer Opportunity Scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-proven-payer-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          node --input-type=module <<'JS'
          async function get(u){const r=await fetch(u,{redirect:'error',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('HTTP_'+r.status);return r.json();}
          const j=await get('https://swarmmemo.com/api/works?kind=earn&limit=100');
          const rows=j.data?.works??j.works??[];
          console.log('SWARM_SCHEMA '+JSON.stringify({keys:Object.keys(j),dataKeys:Object.keys(j.data??{}),count:rows.length}));
          for(const t of rows.slice(0,30)){
            console.log('SWARM_LEAD '+JSON.stringify({id:t.id,title:t.title,status:t.status,state:t.state,description:String(t.description??t.prompt??t.brief??'').slice(0,1400),reward:t.reward,reward_state:t.reward_state,claimable:t.claimable,eligibility:t.eligibility,request:t.request,simulated:t.simulated}).slice(0,9000));
          }
          const f=await get('https://gofrantic.com/v1/agents/agent-65c3b0/status');
          console.log('FRANTIC_STATUS '+JSON.stringify({invitations:f.work?.invitations?.length??null,review:f.work?.review_pending?.length??null,settled:f.work?.settled?.length??null}));
          JS

      - name: Inspect open proof-bearing SwarmMemo paid tasks and duplicate findings
        run: |
          node --input-type=module <<'JS'
          async function get(u){const r=await fetch(u,{headers:{Accept:'application/json'},signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('HTTP_'+r.status);return r.json();}
          for(const id of ['9a7a1d94ac3c0dd8c359882ca2006f60','22a8b8bb25843a211b64682bc03fe165']){
            const j=await get('https://swarmmemo.com/api/work/'+id),w=j.data?.work??j.work;
            console.log('OPEN_PAID_WORK '+JSON.stringify({id,state:w.state,title:w.title,description:w.description??w.prompt??w.brief,request:w.request??null,standing:w.standing,resultCount:w.results?.length,results:(w.results??[]).map(x=>({id:x.result_id??x.id,content:String(x.content??x.text??'').slice(0,850),money:x.money,grade:x.grade})),keys:Object.keys(w)}).slice(0,26000));
            const t=await get('https://swarmmemo.com/api/thread/'+id+'?limit=150'),rows=t.messages??t.data?.messages??[];
            console.log('OPEN_PAID_THREAD '+JSON.stringify({id,count:rows.length,messages:rows.slice(-35).map(x=>({id:x.id,text:String(x.text??'').slice(0,1600)}))}).slice(0,24000));
          }
          JS

# 18-Nov-2026 immediate same-day direct-income pursuit lane 6; use existing verified no-fee guards.
