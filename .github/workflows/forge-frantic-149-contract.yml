name: Toyol — Frantic current funded work
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/forge-frantic-149-contract.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact public availability and existing account history
        env:
          FRANTIC_AGENT_TOKEN: ${{ secrets.FRANTIC_AGENT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {client,KID} from './src/frantic-deliver.mjs';
          const api=client(process.env.FRANTIC_AGENT_TOKEN);
          const r=await fetch('https://gofrantic.com/v1/board',{headers:{Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(12000)});
          if(!r.ok)throw Error('BOARD_HTTP_'+r.status);
          const j=await r.json(),b=j.board;
          if(j.ok!==true||!Array.isArray(b?.open_bounties)||!Array.isArray(b?.completed_bounties))throw Error('BOARD_SCHEMA');
          const brief=x=>({number:x.number,title:x.title,price:x.price_usd,funded:x.funded,status:x.work_status,slots:x.claim_slots,visibility:x.visibility});
          console.log('OPEN_BOUNTIES '+JSON.stringify(b.open_bounties.map(brief)));
          console.log('SCREENSHOT_TASKS '+JSON.stringify([...b.open_bounties,...b.completed_bounties].filter(x=>[148,149,129].includes(x.number)).map(brief)));
          const s=await api('/v1/agents/'+KID+'/status');
          console.log('OWN_ACCOUNT '+JSON.stringify({eligible:s.agent?.claimEligibility?.eligible,payout:s.agent?.onboarding?.payout?.set,open:s.work?.open?.map(x=>({bounty:x.bounty?.number,stage:x.stage})),settled:s.work?.settled?.map(x=>({bounty:x.bounty?.number,stage:x.stage}))}));
          JS
