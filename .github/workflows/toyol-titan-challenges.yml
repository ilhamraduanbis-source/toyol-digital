name: Toyol Titan — Major innovation award scout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-titan-challenges.yml']
  schedule:
    - cron: '42 4,16 * * *'
permissions:
  contents: read
concurrency:
  group: toyol-titan-challenges
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read official award terms and identify major new research leads
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,re,urllib.request
          from html.parser import HTMLParser
          class Visible(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True);self.parts=[];self.skip=0
              def handle_starttag(self,t,a):
                  if t in ('script','style','noscript'):self.skip+=1
              def handle_endtag(self,t):
                  if t in ('script','style','noscript') and self.skip:self.skip-=1
              def handle_data(self,t):
                  if not self.skip:self.parts.append(t)
          now=datetime.datetime.now(datetime.timezone.utc)
          programs=[
            {'id':'cities-deliver','url':'https://www.rockefellerfoundation.org/cities-deliver-ai-solutions-for-public-services/','markers':['$500,000','$2 million','November 29, 2026','city partner','eligible lead organization'],'type':'RESTRICTED_PROJECT_GRANT','amount_min_usd':500000,'amount_max_usd':2000000,'deadline':'2026-11-30T04:59:00Z','eligibility':'Eligible organization with committed city partner and charitable project; no personal award','status':'BLOCKED_ORGANIZATION_AND_CITY_PARTNER'},
            {'id':'meta-vr-start','url':'https://start-developer-competition-26.devpost.com/rules','markers':['November 18, 2026','Start','100,000'],'type':'SHARED_PRIZE_POOL','pool_usd':1000000,'max_individual_usd':100000,'deadline':'2026-11-18T20:00:00Z','eligibility':'Start membership, account, eligible original VR entry and hardware/platform validation','status':'MEMBERSHIP_AND_PROJECT_UNVERIFIED'},
            {'id':'gemma4','url':'https://www.kaggle.com/competitions/gemma-4-developer-agent/rules','markers':['37,000','65,000','Google'],'type':'COMPETITION_PRIZE','main_pool_usd':65000,'main_first_usd':37000,'deadline':'2026-11-25T23:59:00Z','eligibility':'One eligible Kaggle account, accepted rules, original model/config, benchmark, free compute feasibility','status':'RULE_ACCEPTANCE_AND_COMPUTE_UNVERIFIED'},
            {'id':'physical-engineering','url':'https://www.kaggle.com/competitions/physical-engineerings-last-exam/overview/timeline','markers':['400,000','Engineering'],'type':'SHARED_PRIZE_POOL','pool_usd':400000,'eligibility':'Official rules and individual prize allocation, model budgets, engineering validation and registration must be reviewed','status':'RULES_AND_CAPABILITY_UNVERIFIED'},
            {'id':'discovery-index','url':'https://jams.shippedby.app/ai-hackathons-cash-prizes/','markers':['hackathon'],'type':'INDEX_ONLY','eligibility':'Verify every lead on organizer source; no pool treated as individual prize','status':'DISCOVERY_ONLY'}
          ]
          rows=[]
          for p in programs:
              row={k:v for k,v in p.items() if k!='markers'}
              try:
                  req=urllib.request.Request(p['url'],headers={'User-Agent':'ToyolTitanPublicResearch/1.0','Accept':'text/html'})
                  with urllib.request.urlopen(req,timeout=18) as resp:
                      raw=resp.read(2500001)
                      if resp.status!=200 or len(raw)>2500000:raise ValueError('SOURCE_STATUS_OR_SIZE')
                  parser=Visible();parser.feed(raw.decode('utf-8',errors='replace'))
                  body=' '.join(' '.join(parser.parts).split())
                  if len(body)<200:raise ValueError('VISIBLE_CONTENT_INSUFFICIENT')
                  missing=[m for m in p['markers'] if m.lower() not in body.lower()]
                  row.update({'source_http':200,'sha256_visible':hashlib.sha256(body.encode()).hexdigest(),'missing_markers':missing,'source_review_needed':bool(missing)})
                  if p['id']=='discovery-index':
                      row['discovery_excerpts']=[]
                      for m in re.finditer(r'\$\s*(?:[5-9]\d\d,\d{3}|\d{1,3},\d{3},\d{3})\b',body):
                          row['discovery_excerpts'].append(body[max(0,m.start()-100):m.end()+110])
                          if len(row['discovery_excerpts'])>=8:break
              except Exception as e:
                  row.update({'source_error':str(e)[:200],'source_review_needed':True})
              if p.get('deadline') and now>=datetime.datetime.fromisoformat(p['deadline'].replace('Z','+00:00')):
                  row['status']='ENTRY_DEADLINE_PASSED_NO_NEW_ENTRY'
              rows.append(row)
          result={'at':now.isoformat(),'target_usd':500000,'mode':'PUBLIC_AWARD_RESEARCH','programs':rows,'entries_submitted':0,'grants_awarded':0,'verified_income_usd':0,'owner_spend':0,'next_gate':'Review organizer rules, actual individual prize, deadline, nationality, team/organization eligibility, cost and deliverable. Grants restricted to project spending are never personal income. No multiple identities or automatic terms acceptance.'}
          pathlib.Path('out').mkdir(exist_ok=True)
          pathlib.Path('out/titan-awards.json').write_text(json.dumps(result,indent=2)+'\n')
          for row in rows:print('TITAN_SOURCE',json.dumps({k:v for k,v in row.items() if k!='discovery_excerpts'}))
          print('TITAN_STATUS',json.dumps({k:v for k,v in result.items() if k!='programs'}))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Titan — major awards research\n\n| Program | Gate |\n|---|---|\n')
              for row in rows:f.write('| '+row['id']+' | '+row['status']+' |\n')
              f.write('\nNo application, award or payment inferred. Restricted grants are not owner income.\n')
          if not any(r.get('source_http')==200 for r in rows):raise SystemExit('ALL_SOURCES_UNAVAILABLE')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: titan-awards
          path: out/titan-awards.json
          retention-days: 30
          if-no-files-found: error
