name: Toyol — Makefun aggregator official entry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-makefun-aggregator-build.yml']
permissions:
  contents: read
concurrency:
  group: toyol-makefun-aggregator-build
  cancel-in-progress: true
jobs:
  build-and-enter:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Obtain public challenge kit and current official CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/makefun"
          cd "$RUNNER_TEMP/makefun"
          curl --fail --silent --show-error --location --max-time 45 https://make.fun/c/free-model-aggregator-01/kit -o kit.tgz
          python3 - <<'PY'
          import tarfile,pathlib
          with tarfile.open("kit.tgz") as z:
              a=z.getmembers()
              if sum(x.size for x in a)>100_000_000 or any(x.name.startswith("/") or ".." in pathlib.PurePosixPath(x.name).parts or not(x.isfile() or x.isdir()) for x in a):raise SystemExit("UNSAFE_KIT")
              z.extractall(".",filter="data")
          PY
          npm install --prefix "$RUNNER_TEMP/makefun/tools" --no-audit --no-fund @opencode/cli@2.3.0
          echo "$RUNNER_TEMP/makefun/tools/node_modules/.bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/makefun/evidence"
      - name: Record actual free coding-agent sessions in a fresh anchored source repository
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN OPENAI_API_KEY ANTHROPIC_API_KEY OPENCODE_API_KEY
          export HOME="$RUNNER_TEMP/makefun/isolated-home"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_STATE_HOME="$HOME/.local/state"
          export XDG_CACHE_HOME="$HOME/.cache"
          export OPENCODE_DISABLE_AUTOSHARE=true
          mkdir -p "$HOME" "$RUNNER_TEMP/makefun/entry"
          kit="$RUNNER_TEMP/makefun/free-model-aggregator-01-kit"
          entry="$RUNNER_TEMP/makefun/entry"
          cd "$entry"
          node "$kit/cli/makefun.mjs" init --competition free-model-aggregator-01 --wallet At7TxA4e81Ai8X2TWZq944NSSbP1HaJB9iRug4vD1uQ --license MIT
          cp "$kit/starter/main.ts" .
          cp -r "$kit/starter/lib" .
          git add main.ts lib
          git -c user.name='Toyol Digital' -c user.email='toyol@users.noreply.github.com' commit -qm 'Import official competition starter'
          timeout 90 opencode models --standalone > "$RUNNER_TEMP/makefun/models.txt"
          # Verify a zero-priced model from the public pricing catalog AND the actual local model list.
          curl --fail --silent --show-error --max-time 20 https://models.dev/api.json -o "$RUNNER_TEMP/makefun/prices.json"
          MODEL=$(python3 - "$RUNNER_TEMP/makefun/models.txt" "$RUNNER_TEMP/makefun/prices.json" <<'PY'
          import json,sys,re
          avail=set(re.findall(r"opencode/[A-Za-z0-9_.-]+",open(sys.argv[1]).read()))
          data=json.load(open(sys.argv[2])).get("opencode",{}).get("models",{})
          choices=[]
          for mid,row in data.items():
              cost=row.get("cost",{})
              if "opencode/"+mid in avail and (mid.endswith("-free") or mid=="big-pickle") and cost.get("input")==0 and cost.get("output")==0:
                  choices.append(mid)
          if not choices:raise SystemExit("NO_VERIFIED_FREE_MODEL")
          order=["mai-code-1.1-flash-free","deepseek-v4.1-flash-free","glm-5.3-flash-free","big-pickle"]
          choices.sort(key=lambda x:(order.index(x) if x in order else len(order),x))
          print("opencode/"+choices[0])
          PY
          )
          echo "VERIFIED_FREE_MODEL $MODEL"
          python3 - "$MODEL" <<'PY'
          import json,sys
          json.dump({"$schema":"https://opencode.ai/config.json","model":sys.argv[1],"small_model":sys.argv[1],"share":"disabled","autoupdate":False,"permission":{"edit":"allow","read":"allow","bash":"allow","webfetch":"deny","websearch":"deny","external_directory":"allow"}},open("opencode.json","w"))
          PY
          prompt="You are building the Toyol entry for free-model-aggregator-01. FIRST run node $kit/cli/makefun.mjs init --competition free-model-aggregator-01 --wallet At7TxA4e81Ai8X2TWZq944NSSbP1HaJB9iRug4vD1uQ --license MIT in this repository, so its official anchor appears in your recorded tool result before any edit. Read $kit/RULES.txt and the official starter. Make a working material edit to main.ts immediately before extensive analysis; then improve it. Implement an original solution using only the public brief and permitted provider APIs. Quality is 60 percent; maximize weighted quality while respecting capability, budget observations and deterministic failover. Preserve real wire semantics. Make substantive code edits, write tests where useful, explain actual changes. No hidden cases, no scoring exploits, no external model calls from the entry, no credential access, no submissions, no edits outside this entry. Do not alter the license or anchor. The entrypoint must be main.ts."
          set +e
          timeout --kill-after=5s 420s opencode run --standalone --model "$MODEL" --format json "$prompt" </dev/null > "$RUNNER_TEMP/makefun/turn-1.jsonl" 2> "$RUNNER_TEMP/makefun/turn-1.stderr"
          rc=$?
          set -e
          echo "INITIAL_AGENT_EXIT $rc"
          test -s main.ts
          # A timeout may leave genuine useful edits; continue only with the recorded native session.
          for n in 2 3 4; do
            case "$n" in
              2) prompt="Inspect your implementation and revise the actual routing algorithm for quality and quota allocation. Use the public workload manifest only as allowed by the rules; avoid assumptions about hidden cases. Make a substantive edit to main.ts or its runtime dependencies. Explain decisions and run available tests.";;
              3) prompt="Audit cross-wire request and response conversion, native tools, images, system prompts, JSON mode and SSE streaming. Fix real defects in the code and test locally. Preserve provider answers; do not invent them.";;
              4) prompt="Review catalog discovery, free flags, provider refusal handling and determinism. Improve the implementation, with a second real revision of a runtime file. Verify main.ts --list and any existing tests. Explain the changes.";;
              5) prompt="Perform final review against the exact competition rules. Fix remaining correctness defects you can verify. Remove any test-only behavior from the production entry. Report real test outcomes and limitations; do not claim a score you did not obtain. Keep main.ts and its dependencies ready for official grading.";;
            esac
            set +e
            timeout --kill-after=5s 220s opencode run --standalone --continue --model "$MODEL" --format json "$prompt" </dev/null > "$RUNNER_TEMP/makefun/turn-$n.jsonl" 2> "$RUNNER_TEMP/makefun/turn-$n.stderr"
            rc=$?
            set -e
            echo "REVISION_AGENT_EXIT $n $rc"
          done
          git diff --check
          node --experimental-strip-types main.ts --list
          test -f main.ts
          # Commit only source, license and anchor; never commit agent settings or logs.
          git add main.ts lib
          if ! git diff --cached --quiet; then git -c user.name='Toyol Digital' -c user.email='toyol@users.noreply.github.com' commit -qm 'Recorded coding-agent implementation'; fi
          git ls-files --error-unmatch main.ts >/dev/null
          git diff --quiet HEAD -- main.ts lib
          if ! git log --format=%s -- main.ts | grep -v "^Import official competition starter$" > "$RUNNER_TEMP/makefun/source-revisions.txt" || ! test -s "$RUNNER_TEMP/makefun/source-revisions.txt"; then echo "NO_REAL_CODE_CHANGES"; exit 1; fi
          echo "SOURCE_COMMIT $(git rev-parse HEAD)"
          # Collect the harness-native records with the official bundler; do not edit the records.
          printf "%s\n" "Ni last perbincangan toyol. Sambung sini" > "$RUNNER_TEMP/makefun/owner-prompt.txt"
          printf "%s\n" "withheld: private harness instructions; no system prompt disclosed" > "$RUNNER_TEMP/makefun/system-prompt.txt"
          node "$kit/cli/makefun.mjs" bundle --repo "$entry" --out "$RUNNER_TEMP/makefun/transcripts.tar.gz" --opencode-dir "$XDG_DATA_HOME/opencode" --harness opencode --harness-version 2.3.0 --model "$MODEL" --provider opencode --prompt-file "$RUNNER_TEMP/makefun/owner-prompt.txt" --prompt-origin handed-off --prompt-via "Owner delegated Toyol continuation in ChatGPT to this recorded coding harness." --system-prompt "$RUNNER_TEMP/makefun/system-prompt.txt" --effort default --mcp none
          test -s "$RUNNER_TEMP/makefun/transcripts.tar.gz"
          node "$kit/cli/makefun.mjs" check --kit "$kit" --repo "$entry" --transcripts "$RUNNER_TEMP/makefun/transcripts.tar.gz" --json > "$RUNNER_TEMP/makefun/evidence/check.json"
          echo 'LOCAL_ENTRY_GATE_PASSED'
      - name: Run official practice grade and replay at zero model spend
        shell: bash
        run: |
          set -euo pipefail
          unset OPENAI_API_KEY ANTHROPIC_API_KEY
          root="$RUNNER_TEMP/makefun"
          kit="$root/free-model-aggregator-01-kit"
          docker version >/dev/null
          timeout --kill-after=10s 1200s node "$kit/cli/makefun.mjs" grade-local --kit "$kit" --bot "$root/entry" --driver docker --instances 1 --json > "$root/evidence/grade.json"
          python3 - "$root/evidence/grade.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print("OFFICIAL_PRACTICE_GRADE",json.dumps(d)[:7000])
          PY
      - name: Submit once to official contest only after local checks pass
        shell: bash
        env:
          TOYOL_SOLANA_KEYPAIR_JSON: ${{ secrets.TOYOL_SOLANA_KEYPAIR_JSON }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/makefun"
          kit="$root/free-model-aggregator-01-kit"
          export HOME="$root/submission-home"
          mkdir -p "$HOME"
          chmod 700 "$HOME"
          test "$(date -u +%Y%m%d%H%M)" -lt 202611160225 || { echo "DEADLINE_GUARD_NO_SUBMISSION"; exit 0; }
          test -s "$root/evidence/check.json" && test -s "$root/evidence/grade.json"
          # Only the official CLI receives a key. The entrant code and coding agent are never executed in this step.
          key="$HOME/wallet.json"
          umask 077
          trap 'rm -f "$key"; rm -rf "$HOME/.makefun"' EXIT
          printf '%s' "$TOYOL_SOLANA_KEYPAIR_JSON" > "$key"
          unset TOYOL_SOLANA_KEYPAIR_JSON
          node "$kit/cli/makefun.mjs" register --keypair "$key" --origin https://make.fun --name Toyol-Digital --json > "$HOME/auth.json"
          # Confirm no duplicate entry before sending. Read the stored key from the official credentials file without logging it.
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync(process.env.HOME+'/.makefun/credentials','utf8'));
          function walk(v,out=[]){if(typeof v==='string'&&/^af_[A-Za-z0-9_-]+$/.test(v))out.push(v);else if(v&&typeof v==='object')for(const x of Object.values(v))walk(x,out);return out;}
          const keys=[...new Set(walk(raw))];
          if(keys.length!==1)throw Error('AUTH_SCHEMA_REVIEW');
          const r=await fetch('https://make.fun/api/agents/me',{headers:{'x-api-key':keys[0],Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(15000)});
          if(!r.ok)throw Error('ACCOUNT_HTTP_'+r.status);
          const j=await r.json();
          if(!Array.isArray(j.entries))throw Error('ACCOUNT_ENTRIES_SCHEMA');
          if(j.entries.some(x=>JSON.stringify(x).includes('free-model-aggregator-01')))throw Error('ENTRY_ALREADY_PRESENT');
          console.log('ACCOUNT_DUPLICATE_CHECK_PASSED');
          JS
          cd "$root/entry"
          node "$kit/cli/makefun.mjs" submit --competition free-model-aggregator-01 --source "$root/entry" --commit "$(git rev-parse HEAD)" --bundle "$root/transcripts.tar.gz" --keypair "$key" --origin https://make.fun --title 'Toyol Digital Aggregator' --json > "$HOME/submission.json"
          python3 - "$HOME/submission.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          if not isinstance(d,dict):raise SystemExit("RECEIPT_SCHEMA")
          # Output only the public identifier and status; never print private claim codes or credentials.
          print("MAKEFUN_SUBMISSION_RESPONSE",json.dumps({k:d[k] for k in ("id","submission_id","entry_id","status","stage","receipt") if k in d and k!="receipt"}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: makefun-official-check-and-grade
          path: ${{ runner.temp }}/makefun/evidence/
          retention-days: 7
          if-no-files-found: ignore
