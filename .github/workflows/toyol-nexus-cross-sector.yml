name: Toyol Nexus — Academic research and intellectual development
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/nexus-academic.py', 'runner/nexus-academic/curriculum.json', '.github/workflows/toyol-nexus-cross-sector.yml']
  schedule:
    - cron: '23 1 * * *'
permissions:
  contents: read
concurrency:
  group: toyol-nexus-cross-sector
  cancel-in-progress: false
jobs:
  learn:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Validate curriculum and academic audit tools
        run: python3 src/nexus-academic.py --test
      - name: Complete next synthetic practice and check public references
        run: python3 src/nexus-academic.py --cycle
      - name: Preserve only Nexus public learning progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,urllib.request
          p='runner/nexus-academic/progress.json'
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/'+p
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'NexusAcademic','X-GitHub-Api-Version':'2022-11-28'}
          def call(url,method='GET',data=None):
              req=urllib.request.Request(url,headers=h,method=method,data=json.dumps(data).encode() if data else None)
              with urllib.request.urlopen(req,timeout=15) as f:return json.load(f)
          old=call(root+'?ref=main');current=json.loads(base64.b64decode(old['content']));new=json.loads(pathlib.Path(p).read_text());rid=os.environ['GITHUB_RUN_ID']
          if any(x['run_id']==rid for x in current['sessions']):print('NEXUS_PROGRESS_ALREADY_SAVED');raise SystemExit(0)
          if new['sessions'][:-1]!=current['sessions'] or new['sessions'][-1]['run_id']!=rid:raise SystemExit('NEXUS_PROGRESS_CONFLICT_NO_OVERWRITE')
          call(root,'PUT',{'message':'Nexus academic practice evidence (no private data)','content':base64.b64encode(pathlib.Path(p).read_bytes()).decode(),'sha':old['sha'],'branch':'main'})
          print('NEXUS_PROGRESS_SAVED',len(new['sessions']))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nexus-academic-practice
          path: out/nexus-academic/
          retention-days: 30
          if-no-files-found: error
