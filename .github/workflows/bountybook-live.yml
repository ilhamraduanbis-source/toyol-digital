name: Toyol — BountyBook funded job discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/bountybook-live.yml']
  schedule:
    - cron: '11 */6 * * *'
permissions:
  contents: read
jobs:
  direct-market:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read actual BountyBook jobs and public rules without payment
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Toyol-BountyBook/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read(4000000))
          for category in ('code','data','transform','research'):
              try:
                  obj=get('https://api.bountybook.ai/jobs?status=open&category='+category+'&limit=50')
                  rows=obj if isinstance(obj,list) else obj.get('jobs',obj.get('data',[]))
                  if isinstance(rows,dict): rows=rows.get('jobs',[])
                  print(json.dumps({'category':category,'count':len(rows),'jobs':[{k:x.get(k) for k in ('id','title','description','budget_usdc','status','spec','expires_at','payout_status','escrow_status')} for x in rows[:12]]},ensure_ascii=False)[:24000])
              except Exception as e:
                  print(json.dumps({'category':category,'blocked':str(e)[:250]}))
          PY
