name: Toyol Digital — Tests and Hourly Radar (RM0)
on:
  workflow_dispatch:
  schedule:
    - cron: '29 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/toyol.yml'
permissions:
  contents: read
concurrency:
  group: toyol-radar
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Toyol repository only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Toyol safety and patch tests
        run: node --test test/*.test.mjs

  scan:
    # Critical: pushes run tests ONLY. Public Jobbi feed must not be polled more than hourly.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Toyol repository only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan public bounty feed (hourly only)
        run: node src/toyol.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit whether real gigs match Toyol abilities
        run: node src/market.mjs
      - name: Investigate original bounty issue eligibility (read only)
        run: node src/quest-intel.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attempt bounded bounty code fix
        run: node src/worker.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write verified progress to Toyol Quest Board
        run: node src/status.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Membership Hunt (verified identities and private inbox counts)
        run: node src/membership-hunt.mjs
        env:
          TOYOL_OPENTASK_TOKEN: ${{ secrets.TOYOL_OPENTASK_TOKEN }}
          TOYOL_OPENTASK_PROFILE_ID: ${{ vars.TOYOL_OPENTASK_PROFILE_ID }}
      - name: Preserve opportunity, patch and failure evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toyol-run-evidence
          path: |
            out/stage2/
            out/market/
            out/intelligence/
            out/membership/
          if-no-files-found: ignore
          retention-days: 7
