name: Toyol — Clone Colony Controller
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runner/clone-missions.json'
      - '.github/workflows/toyol-clone-controller.yml'
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: toyol-clone-controller
  cancel-in-progress: false
jobs:
  colony:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Adopt active clones and launch explicitly approved new independent workers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const repo='ilhamraduanbis-source/toyol-digital',root='https://api.github.com/repos/'+repo;
          const config=JSON.parse(fs.readFileSync('runner/clone-missions.json','utf8'));
          const now=Date.now();
          assert.equal(config.version,1);
          assert.ok(Number.isInteger(config.maxConcurrent)&&config.maxConcurrent>=1&&config.maxConcurrent<=8);
          assert.ok(Number.isInteger(config.maxLaunchPerTick)&&config.maxLaunchPerTick>=1&&config.maxLaunchPerTick<=3);
          assert.ok(Array.isArray(config.missions)&&config.missions.length<=30);
          const ids=new Set(), names=new Set();
          for(const m of config.missions){
            assert.match(m.id,/^[a-z0-9-]{1,70}$/);
            assert.match(m.workflow,/^[a-z0-9-]+\.yml$/);
            assert.ok(['adopt','scheduled','launch'].includes(m.mode));
            assert.ok(!ids.has(m.id)&&!names.has(m.workflow));
            assert.notEqual(m.workflow,'toyol-clone-controller.yml');
            if(m.mode==='launch')assert.ok(m.deadlineUtc&&Number.isFinite(Date.parse(m.deadlineUtc)),'New launch requires reviewed expiry');
            ids.add(m.id);names.add(m.workflow);
          }
          async function api(path,method='GET',body){
            const res=await fetch(root+path,{method,headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'ToyolCloneController',...(body?{'Content-Type':'application/json'}:{})},redirect:'error',signal:AbortSignal.timeout(12000),...(body?{body:JSON.stringify(body)}:{})});
            if(!res.ok)throw Error('HTTP_'+res.status);
            if(res.status===204)return null;
            const raw=await res.text();if(raw.length>5000000)throw Error('RESPONSE_LIMIT');
            return JSON.parse(raw);
          }
          function classify(m,w,runs,t){
            if(w.state!=='active')return 'DISABLED_OWNER_REVIEW';
            if(runs.some(x=>x.status!=='completed'))return 'ACTIVE';
            if(m.deadlineUtc&&Date.parse(m.deadlineUtc)<=t)return 'EXPIRED_NO_LAUNCH';
            if(runs.length)return m.mode==='scheduled'?'SCHEDULED_EXISTING':'ATTEMPT_RECORDED_REVIEW_RESULT';
            return m.mode==='launch'?'NEW_APPROVED_WORKER':m.mode==='scheduled'?'SCHEDULE_MANAGED':'ADOPT_ONLY';
          }
          // Test the exact anti-duplicate and expiry decisions before making any dispatch.
          const sample={mode:'launch',deadlineUtc:'2099-01-01T00:00:00Z'},active={state:'active'};
          assert.equal(classify(sample,active,[],now),'NEW_APPROVED_WORKER');
          assert.equal(classify(sample,active,[{status:'queued'}],now),'ACTIVE');
          assert.equal(classify(sample,active,[{status:'completed',conclusion:'failure'}],now),'ATTEMPT_RECORDED_REVIEW_RESULT');
          assert.equal(classify({...sample,deadlineUtc:'2000-01-01T00:00:00Z'},active,[],now),'EXPIRED_NO_LAUNCH');
          assert.equal(classify({...sample,mode:'scheduled'},active,[],now),'SCHEDULE_MANAGED');
          const states=[];
          // First observe all workers before granting any concurrency slots.
          for(const mission of config.missions){
            const record={id:mission.id,workflow:mission.workflow,mode:mission.mode,purpose:mission.purpose,decision:'UNKNOWN',latest:null};
            try{
              const workflow=await api('/actions/workflows/'+mission.workflow);
              const data=await api('/actions/workflows/'+mission.workflow+'/runs?branch=main&per_page=20');
              assert.ok(Array.isArray(data.workflow_runs));
              const rows=data.workflow_runs, newest=rows[0];
              record.latest=newest?{id:newest.id,status:newest.status,conclusion:newest.conclusion,url:newest.html_url}:null;
              record.decision=classify(mission,workflow,rows,now);
              record.activeRuns=rows.filter(x=>x.status!=='completed').length;
            }catch(e){record.decision='OBSERVATION_UNAVAILABLE';record.error=String(e.message).slice(0,100);}
            states.push(record);
          }
          let activeCount=states.reduce((n,x)=>n+(x.activeRuns||0),0),launches=0;
          // Fail closed on unknown state, and do not repeat any existing submission or retry failure.
          if(!states.some(x=>x.decision==='OBSERVATION_UNAVAILABLE')){
            for(const s of states){
              if(s.decision!=='NEW_APPROVED_WORKER')continue;
              if(activeCount>=config.maxConcurrent||launches>=config.maxLaunchPerTick){s.decision='CAPACITY_WAIT';continue;}
              try{
                const check=await api('/actions/workflows/'+s.workflow+'/runs?branch=main&per_page=1');
                if(!Array.isArray(check.workflow_runs)||check.workflow_runs.length){s.decision='RACE_OR_PRIOR_RUN_NO_LAUNCH';continue;}
                await api('/actions/workflows/'+s.workflow+'/dispatches','POST',{ref:'main'});
                activeCount++;launches++;s.decision='DISPATCH_REQUESTED_NOT_COMPLETED';
              }catch(e){s.decision='DISPATCH_OUTCOME_UNCERTAIN_NO_RETRY';s.error=String(e.message).slice(0,100);break;}
            }
          }
          const summary=['## Toyol clone colony','', 'Observed active workers: '+activeCount+'; new dispatch requests: '+launches,'','| Mission | Worker status | Latest run |','|---|---|---|'];
          for(const s of states){
            const latest=s.latest;
            summary.push('| '+s.id+' | '+s.decision+' | '+(latest?'['+latest.id+']('+latest.url+') '+(latest.conclusion??latest.status):'—')+' |');
            console.log('CLONE_STATE '+JSON.stringify(s));
          }
          summary.push('','A worker is a bounded GitHub workflow, not a new wallet or a new entrant. No duplicate claim, automatic retry of failed work, deposit, paid compute or payment inferred. Existing schedules remain independent. Receipts are verified by the existing settlement watcher. New missions require an explicitly reviewed workflow, expiry and launch registration.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary.join('\n')+'\n');
          console.log('CLONE_CONTROLLER_COMPLETE '+JSON.stringify({activeCount,launches,missions:states.length,verifiedIncome:false}));
          JS
