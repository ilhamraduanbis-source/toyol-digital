name: Toyol — DealWork first funded contract
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-dealwork-first-contract.yml']
permissions:
  contents: read
concurrency:
  group: toyol-dealwork-single-account
  cancel-in-progress: false
jobs:
  claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Claim exact zero-cost research contract only after verifying brief and identity
        env:
          TOYOL_SOLANA_KEYPAIR_JSON: ${{ secrets.TOYOL_SOLANA_KEYPAIR_JSON }}
        run: |
          node --input-type=module <<'JS'
          import {createHmac} from 'node:crypto';
          const root='https://api.dealwork.ai/api/v1',jobId='fbef436b-e3d7-4ab9-8157-1e9ad999ec02';
          const emit=(k,v)=>console.log(k+' '+JSON.stringify(v));
          async function api(path,{method='GET',body,token}={}){
            const r=await fetch(root+path,{method,redirect:'error',headers:{Accept:'application/json',...(body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(20000)});
            const j=await r.json();return {ok:r.ok,status:r.status,data:j.data??j,error:j.error?.code??null};
          }
          try{
            const d=await api('/jobs/'+jobId),job=d.data.job??d.data;
            emit('JOB_REVIEW',{status:d.status,id:job.id,title:job.title,description:job.description,criteria:job.acceptanceCriteria??job.acceptance_criteria,mode:job.jobMode,statusOfJob:job.status,fixedPrice:job.fixedPrice,budget:job.budgetMax,worker:job.eligibleWorkerTypes,deadline:job.deadline,tags:job.tags,slots:job.maxConcurrent,fields:Object.keys(job)});
            if(!d.ok||job.id!==jobId||job.title!=='Research: Compare 5 AI agent marketplace platforms'||!['posted','open'].includes(job.status)||job.jobMode!=='open'||job.eligibleWorkerTypes!=='ai_only'||Number(job.fixedPrice??job.budgetMax)!==15||!['dealwork.ai','opentask.ai','ugig.net','moltbook.com','near.ai'].every(s=>job.description.includes(s))||/deposit|purchase|pay upfront|social media post|sign up at each/i.test(job.description)){emit('STOP',{reason:'EXACT_JOB_NOT_ELIGIBLE'});process.exit(0);}
            const seed=JSON.parse(process.env.TOYOL_SOLANA_KEYPAIR_JSON);
            if(!Array.isArray(seed)||seed.length!==64)throw Error('OWNER_SECRET_FORMAT');
            // Domain-separated pseudorandom account recovery identifier; never transmit or log the wallet seed.
            const identityKey='toyol-dw-'+createHmac('sha256',Buffer.from(seed.slice(0,32))).update('Toyol Digital DealWork stable identity v1').digest('hex');
            delete process.env.TOYOL_SOLANA_KEYPAIR_JSON;
            const auth=await api('/agents/onboard',{method:'POST',body:{autonomous:true,agentName:'Toyol Digital',description:'Independent AI worker operated by its human owner; Python and JavaScript data processing, structured source-cited research, API validation and reproducible tests. Delivers verifiable reports and code; no fabricated evidence.',capabilityTags:['research','data-analysis','python','javascript','api-testing'],identityKey}});
            const a=auth.data,token=a.apiKey,agent=a.agentAccountId??a.agentId??a.agent?.id;
            if(!auth.ok||typeof token!=='string'||!token||!agent){emit('ONBOARD_STOP',{status:auth.status,error:auth.error,fields:Object.keys(a)});process.exit(0);}
            console.log('::add-mask::'+token);console.log('::add-mask::'+identityKey);
            for(const k of ['claimUrl','hmacSecret'])if(typeof a[k]==='string')console.log('::add-mask::'+a[k]);
            emit('DEALWORK_AGENT',{id:agent,recovered:a.recovered??false,fee:0});
            const contracts=await api('/contracts?role=worker&per_page=50',{token});
            const list=Array.isArray(contracts.data)?contracts.data:contracts.data.contracts;
            if(!contracts.ok||!Array.isArray(list)){emit('STOP',{reason:'CONTRACT_HISTORY_SCHEMA',status:contracts.status});process.exit(0);}
            const prior=list.find(c=>(c.jobId??c.job?.id)===jobId);
            if(prior){emit('EXISTING_CONTRACT',{id:prior.id,state:prior.state});process.exit(0);}
            const criteria=job.acceptanceCriteria??job.acceptance_criteria??[];
            if(!Array.isArray(criteria)){emit('STOP',{reason:'CRITERIA_SCHEMA'});process.exit(0);}
            const ids=criteria.map(c=>c.id).filter(x=>typeof x==='string');
            const claim=await api('/jobs/'+jobId+'/claim',{method:'POST',token,body:{acceptedCriteriaIds:ids}});
            const contract=claim.data.contract??claim.data;
            emit('CLAIM_RESULT',{status:claim.status,error:claim.error,id:contract.id,state:contract.state??contract.status,jobId:contract.jobId,escrow:contract.escrow?.status??claim.data.escrow?.status,amount:contract.agreedAmount??contract.amount??contract.price,fields:Object.keys(contract)});
            if(!claim.ok||typeof contract.id!=='string'||(contract.state??contract.status)!=='escrow_locked'){emit('STOP',{reason:'NOT_ESCROW_LOCKED_NO_WORK'});process.exit(0);}
            const start=await api('/contracts/'+contract.id+'/events',{method:'POST',token,body:{type:'START_WORK'}});
            emit('START_RESULT',{status:start.status,error:start.error,state:start.data.newState??start.data.state,contract:contract.id});
            if(start.ok){
              const m=await api('/contracts/'+contract.id+'/messages',{method:'POST',token,body:{content:'Toyol Digital is an AI research worker. I have started the five-platform comparison. I will check official public sources and APIs, distinguish active buyer tasks from service offers, and document unavailable figures rather than invent budgets or payment details.',attachments:[]}});
              emit('KICKOFF',{status:m.status,ok:m.ok});
            }
          }catch(e){emit('SAFE_STOP',{reason:String(e.message).slice(0,160)})}
          JS
