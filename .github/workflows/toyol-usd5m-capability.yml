name: Toyol — USD5M Capability Assignment (Idle Only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/toyol-procurement-skills.mjs'
      - 'test/toyol-procurement-skills.test.mjs'
      - '.github/workflows/toyol-usd5m-capability.yml'
  schedule:
    - cron: '31 */6 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: toyol-usd5m-capability
  cancel-in-progress: false
jobs:
  assign:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      matrix: ${{ steps.choose.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify public zero-charge context and assign only idle registered clone lanes
        id: choose
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync} from 'node:fs';
          const repo='ilhamraduanbis-source/toyol-digital';
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          const api='https://api.github.com/repos/'+repo;
          async function get(path) {
            const r=await fetch(api+path,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},redirect:'error',signal:AbortSignal.timeout(16000)});
            if(!r.ok)throw Error('GITHUB_READ_FAILED_'+r.status);
            return r.json();
          }
          const meta=await get('');
          assert.equal(meta.private,false,'STOP_NONPUBLIC_PAID_RUNNERS');
          assert.equal(meta.archived,false,'STOP_ARCHIVED');
          const roster=JSON.parse(readFileSync('runner/clone-missions.json','utf8')).missions;
          const byId=new Map(roster.map(m=>[m.id,m]));
          assert.equal(roster.length,14,'REVIEW_ROSTER_CHANGE');
          const priorities=[
            ['atlas-mega-contracts','eu-eligibility'],
            ['orion-mega-contracts','uk-qualification'],
            ['leviathan-contracts','partner-route'],
            ['aggregator','technical-qa'],
            ['tiny-chess-training','commercial'],
            ['titan-awards','us-subcontract'],
            ['wurk-markdown-sales','partner-route'],
            ['frantic-delivery','commercial']
          ];
          const assignments=[],observations=[];
          for(const [clone,task] of priorities){
            const mission=byId.get(clone);assert.ok(mission,'MISSING_REGISTERED_CLONE');
            const [wf,data]=await Promise.all([get('/actions/workflows/'+mission.workflow),get('/actions/workflows/'+mission.workflow+'/runs?branch=main&per_page=10')]);
            assert.ok(Array.isArray(data.workflow_runs),'INCOMPLETE_ACTIVITY');
            const active=data.workflow_runs.some(x=>x.status!=='completed');
            const idle=wf.state==='active'&&!active;
            observations.push({clone,workflow:mission.workflow,idle,active,decision:idle?'AVAILABLE_FOR_SEPARATE_SKILL_JOB':'PRESERVE_EXISTING_JOB'});
            if(idle&&assignments.length<6)assignments.push({clone,task});
          }
          const result={include:assignments.length?assignments:[{clone:'none',task:'none'}]};
          appendFileSync(process.env.GITHUB_OUTPUT,'matrix='+JSON.stringify(result)+'\n');
          console.log('USD5M_IDLE_ASSIGNMENTS '+JSON.stringify({missionsObserved:roster.length,assignments,observations,liveBids:0,ownerSpendUsd:0}));
          JS
  develop:
    needs: assign
    if: needs.assign.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.assign.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate reusable procurement skills and real local synthetic QA
        if: matrix.clone != 'none'
        run: |
          node --check src/toyol-procurement-skills.mjs
          node --test test/toyol-procurement-skills.test.mjs
      - name: Execute assigned independent readiness work
        if: matrix.clone != 'none'
        env:
          CLONE: ${{ matrix.clone }}
          TASK: ${{ matrix.task }}
        run: |
          mkdir -p out/procurement
          node src/toyol-procurement-skills.mjs "$CLONE" "$TASK" "out/procurement/$CLONE.json"
          node -e "const x=require('./out/procurement/'+process.env.CLONE+'.json');if(x.ownerSpendUsd!==0||x.bidsSubmitted!==0||x.incomeVerifiedUsd!==0||x.capabilityCertified!==false)process.exit(1);console.log('READ_ONLY_CAPABILITY_TEST_PASS',x.clone,x.task)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.clone != 'none'
        with:
          name: usd5m-skill-${{ matrix.clone }}-${{ github.run_id }}
          path: out/procurement/
          retention-days: 14
          if-no-files-found: error
