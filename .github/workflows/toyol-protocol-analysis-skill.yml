name: Toyol — Reusable protocol analysis skill tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/protocol-analysis-skill.mjs'
      - '.github/workflows/toyol-protocol-analysis-skill.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test reusable offline analysis with synthetic fixtures
        run: |
          node --check src/protocol-analysis-skill.mjs
          node src/shared-skill-cloud.mjs context protocol-analysis 'defi valuation research' > "$RUNNER_TEMP/shared-context.json"
          node src/shared-skill-cloud.mjs run protocol-analysis --self-test
      - name: Validate on actual public frozen snapshot
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skill-test" out
          curl -fsSL --retry 2 --max-time 60 https://make.fun/c/token-radar-01/kit -o "$RUNNER_TEMP/skill-test/kit.tgz"
          python3 - <<'PY'
          import os,tarfile,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'skill-test'
          with tarfile.open(root/'kit.tgz') as t:
              rows=[x for x in t.getmembers() if x.isfile() and x.name.endswith('/input/snapshot.json')]
              assert len(rows)==1 and rows[0].size<10000000
              (root/'snapshot.json').write_bytes(t.extractfile(rows[0]).read())
          PY
          node src/shared-skill-cloud.mjs run protocol-analysis "$RUNNER_TEMP/skill-test/snapshot.json" > out/analysis.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const x=JSON.parse(fs.readFileSync('out/analysis.json','utf8'));
          assert.equal(x.validation.watchlist_covered,x.validation.watchlist_required);
          assert.ok(x.rows.length>=100);
          assert.equal(new Set(x.rows.map(r=>r.slug)).size,x.rows.length);
          assert.ok(x.rows.every(r=>r.conditional_mcap_usd.low<=r.conditional_mcap_usd.base&&r.conditional_mcap_usd.base<=r.conditional_mcap_usd.high));
          console.log('REAL_SNAPSHOT_VALIDATION',JSON.stringify({rows:x.rows.length,...x.validation}));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: reusable-protocol-skill-analysis
          path: out/analysis.json
          retention-days: 7
