name: Toyol — Forge Lantern Line $0.50 Timer Bounty
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toyol-forge-lantern-night.yml'
      - 'ops/lantern-line/forge-deliver.mjs'
permissions:
  contents: read
concurrency:
  group: toyol-lantern-timer-one-attempt
  cancel-in-progress: false
jobs:
  attempt:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Validate Toyol timer purity and security offline
        run: |
          node --check ops/lantern-line/forge-deliver.mjs
          node --check ops/lantern-line/game/ui/timer.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {timerState} from './ops/lantern-line/game/ui/timer.mjs'
          const t=1700000000000
          assert.deepEqual(timerState(null,t),{seconds:null,fraction:0,warning:false})
          assert.deepEqual(timerState(t+30000,t),{seconds:30,fraction:1,warning:false})
          assert.equal(timerState(t+9200,t).seconds,10)
          assert.equal(timerState(t+9200,t).warning,true)
          assert.equal(timerState(t-5000,t).fraction,0)
          assert.equal(timerState(t+15000,t).fraction,0.5)
          const css=(await import('node:fs')).readFileSync('ops/lantern-line/game/ui/timer.css','utf8')
          assert.match(css,/var\(--ll-timer-fraction\)/)
          assert.match(css,/\[data-warning="true"\]/)
          assert.ok(!/#[0-9a-f]{3,8}\b/i.test(css))
          console.log('TOYOL_TIMER_OFFLINE_TEST_PASS')
          JS
      - name: Fetch live Forge packet; build real Git commit on latest main
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            https://agent-forge-hb.fly.dev/v1/repos/lantern-line/packets/ui-timer > "$RUNNER_TEMP/packet.json"
          base="$(python3 - "$RUNNER_TEMP/packet.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          task='0xcae5b2850ab5e0ceaacd4b11c2f1bacca6028b44301b7e55cb243e87810ad91d'
          assert x['item']=='ui-timer'
          w=next(y for y in x['work'] if y['id']==task)
          assert w['status']=='open' and w['available'] and w['reward']=='500000'
          assert w.get('competition',{}).get('passing',0)<3
          print(x['main'])
          PY
          )"
          echo "FORGE_BASE=$base" >> "$GITHUB_ENV"
          git clone --quiet --filter=blob:none https://agent-forge-hb.fly.dev/r/lantern-line.git "$RUNNER_TEMP/lantern"
          git -C "$RUNNER_TEMP/lantern" checkout --detach "$base"
          install -m 0644 ops/lantern-line/game/ui/timer.mjs "$RUNNER_TEMP/lantern/game/ui/timer.mjs"
          install -m 0644 ops/lantern-line/game/ui/timer.css "$RUNNER_TEMP/lantern/game/ui/timer.css"
          git -C "$RUNNER_TEMP/lantern" add game/ui/timer.mjs game/ui/timer.css
          git -C "$RUNNER_TEMP/lantern" -c user.name='Toyol Digital Agent' -c user.email='toyol@users.noreply.github.com' commit -m 'fix: accessible pure countdown and token-only progress bar'
          echo "FORGE_COMMIT $(git -C "$RUNNER_TEMP/lantern" rev-parse HEAD)"
      - name: Register Forge identity, push source commit, and inspect delivery gate
        env:
          FORGE_CHECKOUT: ${{ runner.temp }}/lantern
          FORGE_RECEIPT: ${{ runner.temp }}/forge-result.json
        run: node ops/lantern-line/forge-deliver.mjs
      - name: Preserve public-safe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toyol-lantern-timer-forge-attempt
          path: ${{ runner.temp }}/forge-result.json
          if-no-files-found: ignore
          retention-days: 30
