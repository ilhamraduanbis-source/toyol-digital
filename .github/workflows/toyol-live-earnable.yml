name: Toyol — Live Earnable Work
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-live-earnable.yml']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect current claimable work and existing Toku identity
        env:
          TOYOL_TOKU_API_KEY: ${{ secrets.TOYOL_TOKU_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          const get=async(u,headers={})=>{const r=await fetch(u,{headers,redirect:'error',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('HTTP_'+r.status);const s=await r.text();if(s.length>8000000)throw Error('TOO_LARGE');return s;};
          for(const [tag,u] of [['FEED','https://agent-bounty-feed.dailydollar.workers.dev/earn-now'],['BASED','https://registry.basedagents.ai/v1/tasks?status=open'],['JOBBI','https://jobbi.org/gigs.json?lane=agent&source=agent-bounties&limit=20']]){
            try{const s=await get(u);console.log(tag+' '+s.slice(0,24000));}catch(e){console.log(tag+'_ERROR '+e.message);}
          }
          try{
            const key=process.env.TOYOL_TOKU_API_KEY;if(!key)throw Error('MISSING_KEY');
            const h={Authorization:'Bearer '+key,Accept:'application/json'},root='https://www.toku.agency';
            const p=JSON.parse(await get(root+'/api/agents/me',h));
            if(p.agent?.name!=='Toyol Digital')throw Error('PROFILE_MISMATCH');
            console.log('TOKU_PROFILE '+JSON.stringify({id:p.agent.id,name:p.agent.name,status:p.agent.status}));
            const setup=JSON.parse(await get(root+'/api/agents/me/setup',h));
            console.log('TOKU_SETUP '+JSON.stringify({keys:Object.keys(setup),score:setup.setupScore,ready:setup.ready,steps:setup.steps?.map(x=>({id:x.id,done:x.done}))}));
            const c=JSON.parse(await get(root+'/api/agents/connect',h));console.log('TOKU_PAYOUT '+JSON.stringify({payoutsEnabled:c.payoutsEnabled,chargesEnabled:c.chargesEnabled,detailsSubmitted:c.detailsSubmitted}));
          }catch(e){console.log('TOKU_ERROR '+e.message);}
          const wallet='0xac57ad3c3f233e5865c3cd652f67ffc82a7af431',task='0x4860b150720fbe92ab2b363d7ebf43b466f7ab24c4adbaaa70d3934486fcd03b';
          try{const a=JSON.parse(await get('https://api.taskmarket.dev/api/tasks/'+task+'/submissions?chainId=4217'));console.log('CAPTAIN '+JSON.stringify({count:a.length,own:a.filter(x=>String(x.workerAddress).toLowerCase()===wallet).map(x=>({id:x.id,checks:x.checks}))}));}catch(e){console.log('CAPTAIN_ERROR '+e.message);}
          JS
