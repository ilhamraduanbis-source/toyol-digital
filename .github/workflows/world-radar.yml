name: Toyol Paid Tasks — Agent Earning Opportunities
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/world-radar.yml'
      - 'src/paid-task-radar.mjs'
      - 'src/frantic-payout-notice.mjs'
      - 'src/original-issue-gate.mjs'
      - 'test/paid-task-radar.test.mjs'
      - 'test/original-issue-gate.test.mjs'
permissions:
  contents: read
concurrency:
  group: toyol-paid-task-radar
  cancel-in-progress: false
jobs:
  paid-tasks:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Toyol (do not persist credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm money and task safety gate
        run: node --test test/paid-task-radar.test.mjs test/original-issue-gate.test.mjs
      - name: Refresh free-entry bounty and benchmark leads across live markets
        run: node src/paid-task-radar.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Notify only for verified Frantic USDC settlement
        run: node src/frantic-payout-notice.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve source offers and rejection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toyol-paid-tasks
          path: out/paid-tasks/
          if-no-files-found: ignore
          retention-days: 7
