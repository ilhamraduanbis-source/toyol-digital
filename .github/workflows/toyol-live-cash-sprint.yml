name: Toyol — Live paid work sprint
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-live-cash-sprint.yml']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Find funded live work across agent venues
        run: |
          node --input-type=module <<'JS'
          const endpoints=[
            ['basedagents','https://api.basedagents.ai/v1/tasks?status=open'],
            ['agentswarm','https://agentswarm.space/api/bounties'],
            ['swarmmemo','https://swarmmemo.com/api/works?kind=rewarded&limit=100'],
            ['taskmarket','https://api.taskmarket.dev/api/tasks?status=open&chainId=8453&limit=30'],
            ['agentbounties','https://agentbounties.app/api/bounties'],
            ['frantic','https://gofrantic.com/v1/board']
          ];
          await Promise.all(endpoints.map(async ([name,url])=>{
            try{
              const r=await fetch(url,{headers:{Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(15000)}),j=await r.json();
              const d=j.data??j;
              const rows=Array.isArray(d)?d:d.tasks??d.bounties??d.works??d.items??d.results??d.board?.bounties??[];
              console.log('VENUE '+JSON.stringify({name,http:r.status,keys:Object.keys(d),count:rows.length}));
              for(const x of rows.slice(0,35)){
                const status=x.status??x.state, reward=x.bounty??x.reward??x.price??x.reward_usdc??x.amount;
                console.log('LIVE_JOB '+JSON.stringify({name,id:x.id??x.taskId??x.number,title:x.title??x.label,description:String(x.description??x.summary??x.body??'').slice(0,1800),status,claimable:x.claimable??null,reward,escrow:x.escrow??null,standing:x.standing??null,deadline:x.expires_at??x.deadline??x.expiryTime??null,url:x.url??null,fields:Object.keys(x)}).slice(0,6500));
              }
            }catch(e){console.log('VENUE_STOP '+JSON.stringify({name,error:String(e.message).slice(0,160)}))}
          }));
          JS

      - name: Identify actual funded Frantic openings and delivery requirements
        env:
          FRANTIC_AGENT_TOKEN: ${{ secrets.FRANTIC_AGENT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const root='https://gofrantic.com';
          async function get(p){const r=await fetch(root+p,{headers:{Accept:'application/json',Authorization:'Bearer '+process.env.FRANTIC_AGENT_TOKEN},redirect:'error',signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('HTTP_'+r.status);return r.json()}
          const status=await get('/v1/agents/agent-65c3b0/status');
          console.log('FRANTIC_READY '+JSON.stringify({eligible:status.agent?.claimEligibility,open:status.work?.open?.length,payout:status.agent?.onboarding?.payout?.set}));
          const j=await get('/v1/board'),rows=j.board?.bounties??j.board??j.bounties??[];
          const open=rows.filter(b=>b.funded===true&&b.work_status==='open');
          console.log('FRANTIC_OPEN '+JSON.stringify(open.map(b=>({n:b.number,title:b.title,price:b.price_usd,slots:b.claim_slots}))));
          for(const b of open.slice(0,20)){
            try{const z=(await get('/v1/bounties/'+b.number)).bounty;console.log('FRANTIC_CONTRACT '+JSON.stringify({number:z.number,title:z.title,price_cents:z.price_cents,description:z.description,criteria:z.criteria,delivery_contract:z.delivery_contract,claim_progress:z.claim_progress,visibility:z.visibility,funded:z.funded,work_status:z.work_status}).slice(0,18000))}
            catch(e){console.log('DETAIL_UNAVAILABLE '+b.number+' '+e.message)}
          }
          JS

      - name: Verify cash-paid SwarmMemo listing and actual payout evidence
        run: |
          node --input-type=module <<'JS'
          const id='92c95d06bb9c494e002fe3788977b16c',url='https://swarmmemo.com/api/work/'+id;
          const r=await fetch(url,{redirect:'error',signal:AbortSignal.timeout(15000)}),j=await r.json(),w=j.data?.work;
          console.log('SWARM_EXACT_TASK '+JSON.stringify({http:r.status,id:w?.id,title:w?.title,request:w?.request,eligibility:w?.eligibility,standing:w?.standing,claimable:w?.claimable,results:w?.results?.map(x=>({id:x.result_id,author:x.author??x.agent,created:x.created_at,money:x.money,fields:Object.keys(x),verdict:x.verdict}))}).slice(0,23000));
          JS
