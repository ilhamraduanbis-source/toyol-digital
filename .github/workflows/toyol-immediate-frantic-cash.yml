name: Toyol — Immediate Frantic Cash Eligibility Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-immediate-frantic-cash.yml']
permissions:
  contents: read
jobs:
  gate:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read legitimate paid Frantic contract details and exact worker account readiness
        env:
          FRANTIC_AGENT_TOKEN: ${{ secrets.FRANTIC_AGENT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const root='https://gofrantic.com',token=process.env.FRANTIC_AGENT_TOKEN,kid='agent-65c3b0';
          if(!/^fr_agent_[A-Za-z0-9_-]+$/.test(token||''))throw Error('FRANTIC_ACCOUNT_NOT_READY');
          async function get(path){
            const r=await fetch(root+path,{headers:{Authorization:'Bearer '+token,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(16000)});
            if(!r.ok)throw Error('HTTP_'+r.status+'_'+path);
            return r.json();
          }
          const s=await get('/v1/agents/'+kid+'/status');
          if(s.agent?.kid!==kid)throw Error('ACCOUNT_ID_MISMATCH');
          console.log('WORKER_READINESS '+JSON.stringify({
            claimEligible:s.agent?.claimEligibility?.eligible??null,
            sworn:s.verification?.sworn??null,payoutReady:s.agent?.onboarding?.payout?.set??null,
            active:(s.work?.open??[]).map(x=>({n:x.bounty?.number,stage:x.stage,claimId:x.claimId,deliveryDue:x.deliver_deadline_at})),
            settled:(s.work?.settled??[]).map(x=>({n:x.bounty?.number,stage:x.stage}))}));
          // High-value contract decision: inspect only genuinely funded and open worker slots.
          try{
            const listing=await get('/v1/board?status=open&limit=50');
            const found=listing.board?.bounties??listing.board??listing.bounties??listing.items??[];
            if(!Array.isArray(found))throw Error('BOARD_SHAPE_UNKNOWN');
            const eligible=found.filter(x=>x.funded===true && ['open','claimable','active'].includes(String(x.work_status??'').toLowerCase()) && Number(x.claim_slots?.available??x.claim_slots?.open??x.claim_slots??1)>0);
            const byValue=eligible.sort((a,b)=>Number(b.price_usd??0)-Number(a.price_usd??0));
            console.log('REAL_FUNDED_OPEN_BOARD '+JSON.stringify({all:found.length,fundedOpen:byValue.length,highValue:byValue.filter(x=>Number(x.price_usd)>=10).length,available:byValue.slice(0,30).map(x=>({id:x.number,title:x.title,usd:x.price_usd,slots:x.claim_slots,visibility:x.visibility,workStatus:x.work_status,actions:x.actions}))}).slice(0,18500));
            for(const b of byValue.filter(x=>Number(x.price_usd)>=10).slice(0,20)){
              try{
                const full=await get('/v1/bounties/'+b.number);
                const x=full.bounty??full;
                console.log('HIGH_VALUE_CONTRACT '+JSON.stringify({id:x.number,title:x.title,price:x.price_usd,price_cents:x.price_cents,funded:x.funded,visibility:x.visibility,work_status:x.work_status,claim_slots:x.claim_slots,claim_progress:x.claim_progress,eligibility:x.eligibility,requirements:x.requirements,criteria:x.criteria,description:String(x.description??'').slice(0,12000),delivery_contract:x.delivery_contract,terms:x.terms,actions:x.actions}).slice(0,22000));
              }catch(e){console.log('HIGH_VALUE_DETAIL_ERROR '+JSON.stringify({id:b.number,reason:e.message}));}
            }
          }catch(e){console.log('HIGH_VALUE_BOARD_ERROR '+String(e.message).slice(0,300));}
          for(const n of [147,149,128,97]){
            try{
              const j=await get('/v1/bounties/'+n),b=j.bounty??j;
              console.log('EXACT_FUNDED_CONTRACT '+JSON.stringify({
                n,title:b.title,price:b.price_usd,cents:b.price_cents,
                funded:b.funded,public:b.visibility,
                workStatus:b.work_status,claim_progress:b.claim_progress,
                criteria:b.criteria,description:String(b.description??'').slice(0,11000),
                delivery_contract:b.delivery_contract,eligibility:b.eligibility,
                terms:b.terms??null
              }).slice(0,23000));
            }catch(e){console.log('CONTRACT_CHECK_UNAVAILABLE '+JSON.stringify({n,error:String(e.message).slice(0,170)}));}
          }
          JS
# Owner-authorized 18 Nov 2026 immediate cash sprint for unused clone lane 2; gates intact.

# Owner-directed 2026-11-18 same-day paid-work eligibility refresh; never spend owner funds.
