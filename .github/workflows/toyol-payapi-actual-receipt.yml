name: Toyol — PayAPI Actual 0.01 USDC Receipt Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-payapi-actual-receipt.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Validate public USDC transfer from PayAPI listing receipt, no signing
        run: |
          node --input-type=module <<'JS'
          const hash='0x46c154da1bf6b564bc80c42cb9a30745573be2b2d531af1d7c81d6fcf14556f1';
          const wallet='0xac57ad3c3f233e5865c3cd652f67ffc82a7af431';
          const usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913';
          const topic='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
          const providers=['https://mainnet.base.org','https://base-rpc.publicnode.com'];
          async function rpc(method,params){
            for(const url of providers){
              try{
                const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:AbortSignal.timeout(10000),redirect:'error'});
                if(!r.ok)continue;const x=await r.json();if(!x.error&&x.result!==undefined)return x.result;
              }catch{}
            }
            throw Error('RPC_UNAVAILABLE_'+method);
          }
          try{
            if(await rpc('eth_chainId',[])!=='0x2105')throw Error('CHAIN_MISMATCH');
            const receipt=await rpc('eth_getTransactionReceipt',[hash]);
            if(!receipt||receipt.transactionHash.toLowerCase()!==hash||receipt.status!=='0x1')throw Error('NO_SUCCESS_RECEIPT');
            const finalized=await rpc('eth_getBlockByNumber',['finalized',false]);
            if(!finalized||BigInt(finalized.number)<BigInt(receipt.blockNumber))throw Error('NOT_FINALIZED');
            const rows=(receipt.logs||[]).filter(x=>x.address?.toLowerCase()===usdc&&x.topics?.[0]?.toLowerCase()===topic&&
              x.topics?.[2]?.slice(-40).toLowerCase()===wallet.slice(2)).map(x=>({from:'0x'+x.topics[1].slice(-40),to:wallet,usdcMicros:BigInt(x.data).toString()}));
            const total=rows.reduce((n,x)=>n+BigInt(x.usdcMicros),0n);
            console.log('PAYAPI_CHAIN_CHECK '+JSON.stringify({receipt:hash,chain:8453,txStatus:'success',finalized:true,block:BigInt(receipt.blockNumber).toString(),transfers:rows,totalUSDCMicros:total.toString(),matchesOneCent:total===10000n,source:'PayAPI Market published receipt 18 Nov 2026',paymentSourceAttribution:'PAYAPI_LISTING_REPORTED_NOT_INDEPENDENTLY_PROVEN_BY_CHAIN',noNewTodayClaim:true}));
            if(total!==10000n)process.exitCode=1;
          }catch(e){console.log('PAYAPI_CHAIN_CHECK_UNVERIFIED '+JSON.stringify({reason:String(e.message),amountCounted:0}));process.exitCode=1;}
          JS
