name: Toyol Five-Track Capability CI (zero-spend)
on:
  workflow_dispatch:
  push:
    paths:
      - 'ops/five-track-lab/**'
      - '.github/workflows/toyol-five-track-capability-ci.yml'
permissions:
  contents: read
concurrency:
  group: toyol-five-track-proofdesk
  cancel-in-progress: false
jobs:
  test:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract only the five-track lab into a clean workspace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/toyol5"
          python - <<'PY'
          import zipfile, pathlib
          archive=pathlib.Path('ops/five-track-lab/Toyol_Five_Track_Opportunity_Lab_2026-11-23.zip')
          root=pathlib.Path('/tmp/toyol-five-track-ci')
          root.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  p=pathlib.PurePosixPath(info.filename)
                  assert p.parts and p.parts[0]=='toyol-five-track-lab'
                  assert '..' not in p.parts and not info.filename.startswith('/')
              z.extractall(root)
          print('SOURCE_EXTRACTED',len(zipfile.ZipFile(archive).namelist()))
          PY
      - name: Python capability tests
        run: python /tmp/toyol-five-track-ci/toyol-five-track-lab/run_checks.py
      - name: Real Chromium browser interactions (no external service)
        shell: bash
        run: |
          python -m pip install --no-cache-dir playwright==1.56.0
          CHROME=$(command -v google-chrome || command -v chromium || true)
          test -n "$CHROME"
          sed -i "s|/usr/bin/chromium|$CHROME|g" /tmp/toyol-five-track-ci/toyol-five-track-lab/tests/browser_e2e.py
          python /tmp/toyol-five-track-ci/toyol-five-track-lab/tests/browser_e2e.py
      - name: Build actual Even Hub SDK adapter using free npm packages
        shell: bash
        working-directory: /tmp/toyol-five-track-ci/toyol-five-track-lab/integrations/even-g2
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Pack actual Even Hub G2 app with official CLI, no portal login
        shell: bash
        working-directory: /tmp/toyol-five-track-ci/toyol-five-track-lab/integrations/even-g2
        run: |
          npx --no-install evenhub pack app.json dist -o "$RUNNER_TEMP/toyol-proofdesk.ehpk"
          test -s "$RUNNER_TEMP/toyol-proofdesk.ehpk"
          echo "EVENHUB_LOCAL_PACKAGE_CREATED; simulator and official event signup still NOT verified"
      - name: Preserve locally generated Even Hub package (not uploaded to Hub)
        uses: actions/upload-artifact@v4
        with:
          name: evenhub-proofdesk-local-build-unsubmitted
          path: ${{ runner.temp }}/toyol-proofdesk.ehpk
          if-no-files-found: error
          retention-days: 7
      - name: Build actual Firebase AI Logic adapter without contacting the API
        shell: bash
        working-directory: /tmp/toyol-five-track-ci/toyol-five-track-lab/integrations/firebase-hybrid
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Validate original Gemma 4 agent configuration and build candidate submission bundle
        shell: bash
        working-directory: ops/five-track-lab/entrykits/gemma4
        run: |
          python -m unittest -v test_package.py
          python package.py --out "${RUNNER_TEMP}/gemma4-submission.zip"
          python -c "import zipfile,os; p=os.path.join(os.environ['RUNNER_TEMP'],'gemma4-submission.zip'); z=zipfile.ZipFile(p); assert 'agent.yaml' in z.namelist(); print('GEMMA4_PACKAGE_PREFLIGHT_PASS')"
      - name: Preserve Gemma 4 candidate zip (not a contest submission)
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-config-candidate-unsubmitted
          path: ${{ runner.temp }}/gemma4-submission.zip
          if-no-files-found: error
          retention-days: 7
      - name: Report honest bounds
        run: |
          echo "TOYOL_FIVE_TRACK: source tests & SDK builds completed"
          echo "REGISTRATIONS=unverified SUBMISSIONS=unverified AWARDS_USD=0"

  pocketops-g2:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    defaults:
      run:
        working-directory: ops/five-track-lab/apps/pocketops-g2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official Even Hub dependencies (no paid APIs)
        run: npm install --no-audit --no-fund
      - name: Pure offline proof-gate regression suite
        run: npm test
      - name: Real Even Hub SDK build
        run: npm run build
      - name: Package native Even Hub G2 application
        run: npx --no-install evenhub pack app.json dist -o "$RUNNER_TEMP/pocketops-g2.ehpk"
      - name: Install official simulator Linux WebKit/GTK runtime from Ubuntu packages
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 ffmpeg
          ldd ./node_modules/@evenrealities/sim-linux-x64/bin/evenhub-simulator > "$RUNNER_TEMP/pocketops-ldd.log"
          if grep -q 'not found' "$RUNNER_TEMP/pocketops-ldd.log"; then cat "$RUNNER_TEMP/pocketops-ldd.log"; exit 1; fi
      - name: Run the official Even Hub simulator and test actual gestures
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > "$RUNNER_TEMP/pocketops-vite.log" 2>&1 &
          VITE_PID=$!
          xvfb-run -a node ./node_modules/@evenrealities/evenhub-simulator/bin/index.js http://127.0.0.1:5173 --automation-port 9898 > "$RUNNER_TEMP/pocketops-simulator.log" 2>&1 &
          SIM_PID=$!
          trap 'kill "$SIM_PID" "$VITE_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 70); do
            if curl -fsS --max-time 2 http://127.0.0.1:9898/api/ping >/dev/null 2>&1; then READY=1; break; fi
            if ! kill -0 "$SIM_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo 'OFFICIAL_SIMULATOR_NO_START'; tail -80 "$RUNNER_TEMP/pocketops-simulator.log"; exit 1
          fi
          sleep 4
          curl -fsS --max-time 15 http://127.0.0.1:9898/api/screenshot/glasses -o "$RUNNER_TEMP/pocketops-g2-before.png"
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -d '{"action":"click"}' http://127.0.0.1:9898/api/input
          sleep 2
          curl -fsS --max-time 15 http://127.0.0.1:9898/api/screenshot/glasses -o "$RUNNER_TEMP/pocketops-g2-after.png"
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          import os
          from PIL import Image, ImageChops
          d=os.environ['RUNNER_TEMP']
          a=Image.open(os.path.join(d,'pocketops-g2-before.png')).convert('RGBA')
          b=Image.open(os.path.join(d,'pocketops-g2-after.png')).convert('RGBA')
          assert a.size == (576,288), ('unexpected HUD dimensions',a.size)
          assert ImageChops.difference(a,b).getbbox() is not None, 'GLASSES_IMAGE_UNCHANGED: gesture did not update display'
          assert sum(1 for px in a.getdata() if px[3]>128)>1000 and sum(1 for px in b.getdata() if px[3]>128)>1000, 'GLASSES_EMPTY'
          print('OFFICIAL_EVEN_G2_SIMULATOR_GESTURE_SCREENSHOT_PASS')
          PY
          EVEN_DEMO_OUT="$RUNNER_TEMP/pocketops-g2-simulator-real.mp4" python3 scripts/record_sim_demo.py
          test -s "$RUNNER_TEMP/pocketops-g2-simulator-real.mp4"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$RUNNER_TEMP/pocketops-g2-simulator-real.mp4"
      - name: Preserve simulator evidence and local package even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketops-g2-original-simulator-evidence
          path: |
            ${{ runner.temp }}/pocketops-g2.ehpk
            ${{ runner.temp }}/pocketops-g2-before.png
            ${{ runner.temp }}/pocketops-g2-after.png
            ${{ runner.temp }}/pocketops-g2-simulator-real.mp4
            ${{ runner.temp }}/pocketops-simulator.log
            ${{ runner.temp }}/pocketops-vite.log
          if-no-files-found: warn
          retention-days: 7

  firebase-proofsafe:
    if: github.repository == 'ilhamraduanbis-source/toyol-digital'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ops/five-track-lab/apps/firebase-proofsafe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase SDK without secrets or billing
        run: npm install --no-audit --no-fund
      - name: Test no-spend four-factor cloud guard
        run: npm test
      - name: Build real Firebase AI Logic SDK app with fallback OFF
        run: npm run build
      - name: Assert build has default cloud fallback disabled
        run: |
          test -f dist/index.html
          ! grep -r -F 'NO_CLOUD_BILLING_CONFIRMED_BY_TEST' dist/
          echo "FIREBASE_SDK_BUILD_PASS; REMOTE_INFERENCE=NOT_EXECUTED; BILLING=NO"
