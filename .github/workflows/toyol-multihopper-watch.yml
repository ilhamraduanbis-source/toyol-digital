name: Toyol Hopper — Long-term MultiHopper partner watch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-multihopper-watch.yml']
  schedule:
    - cron: '41 3 * * *'
permissions:
  contents: read
concurrency:
  group: toyol-multihopper-watch
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read public partner terms, campaign rules and integration requirements
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, urllib.request
          from html.parser import HTMLParser
          class Visible(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.parts=[]; self.skip=0
              def handle_starttag(self,tag,attrs):
                  if tag in ('script','style','noscript'): self.skip+=1
              def handle_endtag(self,tag):
                  if tag in ('script','style','noscript') and self.skip: self.skip-=1
              def handle_data(self,text):
                  if not self.skip: self.parts.append(text)
          sources={
              'campaign':'https://business.multihopper.com/build-and-route/',
              'partners':'https://business.multihopper.com/developers/',
              'quickstart':'https://dev-docs.multihopper.com/quickstart',
              'security':'https://dev-docs.multihopper.com/concepts/security',
              'earn':'https://superteam.fun/earn/listing/multihopper-build-and-route-challenge-up-to-dollar50000-revenue-share-1/'
          }
          out=pathlib.Path('out'); out.mkdir(exist_ok=True)
          observations={}
          for name,url in sources.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'ToyolHopperPublicDocs/1.0','Accept':'text/html'})
                  with urllib.request.urlopen(req,timeout=15) as resp:
                      if resp.status!=200 or resp.url.split('/')[2]!=url.split('/')[2]: raise ValueError('SOURCE_REDIRECT_OR_STATUS')
                      raw=resp.read(2500001)
                  if len(raw)>2500000: raise ValueError('RESPONSE_LIMIT')
                  parser=Visible(); parser.feed(raw.decode('utf-8',errors='replace'))
                  text=' '.join(' '.join(parser.parts).split())
                  if len(text)<300: raise ValueError('INSUFFICIENT_VISIBLE_CONTENT')
                  checks={
                      'campaign':['0.25%','$100,000','$5,000','$50,000','30 November 2026','60%','25%','15%'],
                      'partners':['devnet','revenue sharing','production'],
                      'quickstart':['mh_test_','mh_live_','devnet.multihopper.com','confirm-broadcast'],
                      'security':['Security Model','smart contract'],
                      'earn':['0.25%','$100,000']
                  }[name]
                  missing=[x for x in checks if x.lower() not in text.lower()]
                  observations[name]={'url':url,'http':200,'sha256_visible':hashlib.sha256(text.encode()).hexdigest(),'expected_terms_present':not missing,'missing_terms':missing}
                  # Retain bounded contextual excerpts, not the entire third-party page.
                  observations[name]['excerpts']=[]
                  for term in checks:
                      i=text.lower().find(term.lower())
                      if i>=0: observations[name]['excerpts'].append(text[max(0,i-45):i+len(term)+100])
              except Exception as e:
                  observations[name]={'url':url,'error':type(e).__name__,'expected_terms_present':False}
          review=any(not x.get('expected_terms_present') for x in observations.values())
          result={'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'mode':'READ_ONLY_PARTNER_RESEARCH','sources':observations,'review_required':review,'campaign_nominal_end':'2026-11-30','campaign_exact_utc_boundary_unconfirmed':True,'partner_approval_verified':False,'devnet_integration_verified':False,'production_volume_verified':False,'income_verified':False,'transactions_signed':0,'owner_spend':0,'next_gate':'Review source changes and partner terms; validate a real customer use case and obtain authorized devnet access before building a live integration. Continue partner research after campaign end.'}
          (out/'hopper-status.json').write_text(json.dumps(result,indent=2)+'\n')
          for k,v in observations.items():
              print('HOPPER_SOURCE',k,json.dumps({x:y for x,y in v.items() if x!='excerpts'}))
          print('HOPPER_STATUS',json.dumps({k:v for k,v in result.items() if k!='sources'}))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Toyol Hopper — long-term partner research\n\n')
              f.write('| Source | Observation |\n|---|---|\n')
              for k,v in observations.items(): f.write('| '+k+' | '+('Expected terms visible' if v.get('expected_terms_present') else 'Needs source review')+' |\n')
              f.write('\nNo onboarding, transaction, spending or payment inferred. This monitor continues beyond the challenge deadline.\n')
          if not any('http' in v for v in observations.values()): raise SystemExit('ALL_SOURCES_UNAVAILABLE')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: toyol-hopper-public-status
          path: out/hopper-status.json
          retention-days: 30
          if-no-files-found: error
