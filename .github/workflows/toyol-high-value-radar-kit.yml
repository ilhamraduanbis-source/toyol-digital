name: Toyol — High value token radar requirements audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-high-value-radar-kit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Read official $1325 competition kit and identify required inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/radar-kit" out
          curl -fsSL --retry 2 --max-time 60 https://make.fun/c/token-radar-01/kit -o "$RUNNER_TEMP/radar.tar.gz"
          curl -fsSL --max-time 25 https://make.fun/api/competitions/token-radar-01/requirements -o out/requirements.json
          python3 - <<'PY'
          import json,os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root/'radar.tar.gz') as t:
              rows=t.getmembers()
              assert sum(x.size for x in rows)<150_000_000
              assert all(not x.name.startswith('/') and '..' not in pathlib.PurePosixPath(x.name).parts and (x.isfile() or x.isdir()) for x in rows)
              t.extractall(root/'radar-kit',filter='data')
          files=[p for p in (root/'radar-kit').rglob('*') if p.is_file()]
          for p in files:
              print('KIT',p.relative_to(root/'radar-kit'),p.stat().st_size)
              if p.name in ('RULES.txt','BRIEF.md','README.md','makefun-board.ts') and p.stat().st_size<100000:
                  print(p.read_text(errors='replace')[:50000])
              if p.suffix=='.json' and p.stat().st_size<30000000 and 'package' not in p.name:
                  try:
                      d=json.loads(p.read_text())
                      if isinstance(d,list):
                          print('DATA_SCHEMA',p.name,'rows',len(d),'first_keys',list(d[0]) if d and isinstance(d[0],dict) else [])
                      elif isinstance(d,dict): print('DATA_SCHEMA',p.name,list(d)[:35])
                  except Exception: pass
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: token-radar-public-requirements
          path: out/requirements.json
          retention-days: 7
