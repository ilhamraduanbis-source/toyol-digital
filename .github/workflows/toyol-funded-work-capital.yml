name: Toyol — Funded work and capital check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toyol-funded-work-capital.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check verified operating funds and real buyer jobs, without moving money
        run: |
          node --input-type=module <<'JS'
          const emit=(k,x)=>console.log(k+' '+JSON.stringify(x));
          async function get(url,opts={}){
            const r=await fetch(url,{...opts,redirect:'error',headers:{Accept:'application/json',...(opts.headers??{})},signal:AbortSignal.timeout(12000)});
            if(!r.ok)throw Error('HTTP_'+r.status);
            const t=await r.text();if(t.length>4000000)throw Error('SIZE');return JSON.parse(t);
          }
          const rpc=async(method,params)=>{const j=await get('https://mainnet.base.org',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});if(j.error||j.result==null)throw Error('RPC');return j.result;};
          try{
            const w='0xac57ad3c3f233e5865c3cd652f67ffc82a7af431';
            if(BigInt(await rpc('eth_chainId',[]))!==8453n)throw Error('CHAIN');
            const block=(await rpc('eth_getBlockByNumber',['finalized',false])).number;
            const usdc=BigInt(await rpc('eth_call',[{to:'0x833589fcd6edb6e08f4c7c32d4f71b54bda02913',data:'0x70a08231'+w.slice(2).padStart(64,'0')},block]));
            const eth=BigInt(await rpc('eth_getBalance',[w,block]));
            emit('CAPITAL_VERIFIED',{usdcMicros:usdc.toString(),ethWei:eth.toString(),block,finality:'finalized',notSpent:true});
          }catch(e){emit('CAPITAL_UNAVAILABLE',{reason:e.message});}
          // Discover the exact advertised API query rather than guessing status values.
          try{
            const spec=await get('https://dealwork.ai/openapi.json');
            const route=spec.paths?.['/jobs']??spec.paths?.['/api/v1/jobs'];
            emit('DEALWORK_API_SCHEMA',{servers:spec.servers,parameters:route?.get?.parameters,job:spec.components?.schemas?.Job,listing:spec.components?.schemas?.Listing});
          }catch(e){emit('DEALWORK_SCHEMA_UNAVAILABLE',{reason:e.message});}
          try{
            const r=await fetch('https://api.dealwork.ai/api/v1/jobs?status=open&per_page=50',{redirect:'error',signal:AbortSignal.timeout(12000),headers:{Accept:'application/json'}});
            const t=await r.text();if(t.length<4000)emit('DEALWORK_QUERY_RESPONSE',{status:r.status,body:t});
          }catch(e){emit('DEALWORK_QUERY_ERROR',{reason:e.message});}
          // Exhaust the buyer market, not the seller advertisements on its first page.
          try{
            const found=[];let total=0,inspected=0;
            for(let page=1;page<=10;page++){
              const j=await get('https://api.dealwork.ai/api/v1/jobs?per_page=50&page='+page);
              const rows=Array.isArray(j)?j:j.data?.jobs??j.data??j.jobs;
              if(!Array.isArray(rows))throw Error('SCHEMA');
              total=j.meta?.total??total;inspected+=rows.length;
              for(const x of rows){
                if(!['posted','bidding'].includes(x.status)||x.eligibleWorkerTypes==='human_only'||x.posterFunded!==true||x.sourceListingId||x.sourceType==='listing')continue;
                if(/(?:i (?:offer|deliver|specialize|provide|build)|my service|i am grok|send me |you receive|hire me|my offer|i will |i'm posting it here|i can help)/i.test(x.description??''))continue;
                found.push({id:x.id,title:x.title,description:String(x.description??'').slice(0,3500),price:x.fixedPrice??x.budgetMax,jobMode:x.jobMode,claimable:x.claimable,remainingSlots:x.remainingSlots,blocked:x.claimBlockedReason,bidCount:x.bidCount,deadline:x.deadline,acceptance:x.acceptanceCriteria});
              }
              if(rows.length<50||inspected>=total&&total>0)break;
            }
            emit('DEALWORK_FUNDED_BUYERS',{inspected,total,found});
          }catch(e){emit('DEALWORK_FUNDED_ERROR',{reason:e.message});}
          try{
            const j=await get('https://gofrantic.com/v1/bounties');
            const rows=j.bounties??j.data?.bounties??j.data;
            emit('FRANTIC_OPEN',{rows:Array.isArray(rows)?rows.filter(x=>x.work_status==='open'&&x.funded===true).map(x=>({number:x.number,title:x.title,price:x.price_cents,description:String(x.description??'').slice(0,2500),progress:x.claim_progress,criteria:x.criteria,delivery:x.delivery_contract})):[],keys:Object.keys(j)});
          }catch(e){emit('FRANTIC_OPEN_ERROR',{reason:e.message});}
          // One-time live checks for alternative markets: inspect funding before any work.
          for(const [name,url] of [
            ['MOLT_ALT','https://molt-jobs.com/api/v1/jobs?status=open'],
            ['MOLT_ALT_DOC','https://molt-jobs.com/skill.md'],
            ['MOLT_MAIN','https://api.moltjobs.io/v1/jobs?status=OPEN'],
            ['AGENT_BOUNTIES','https://api.agentbounties.app/v1/opportunities'],
            ['SWARM_CURRENT','https://swarmmemo.com/api/works?kind=rewarded&limit=100']
          ]){
            try{
              const res=await fetch(url,{headers:{Accept:'application/json'},redirect:'follow',signal:AbortSignal.timeout(18000)});
              const t=await res.text();
              if(!res.ok){emit(name+'_HTTP',{status:res.status,detail:t.slice(0,300)});continue;}
              if(name==='MOLT_ALT_DOC'){emit(name,{text:t.slice(0,15000)});continue;}
              const j=JSON.parse(t);
              if(name==='AGENT_BOUNTIES'){
                const rows=j.items??[];
                emit(name,{generated:j.generated_at,degraded:j.degraded,items:rows.length,ready:rows.filter(x=>x.payment_committed===true&&x.work_state==='claimable'&&x.verification_ready===true).map(x=>({title:x.title,id:x.opportunity_id,reward:x.reward,bond:x.bond,deadline:x.deadline,action:x.next_action,goal:x.goal,source:x.source_url})).slice(0,20)});
              }else if(name==='SWARM_CURRENT'){
                const rows=j.data?.works??j.works??[];
                emit(name,{rows:rows.map(x=>({id:x.id,title:x.title,state:x.state,claimable:x.claimable,standing:x.standing,keys:Object.keys(x)}))});
              }else emit(name,{keys:Object.keys(j),data:j.data??j.jobs??j});
            }catch(e){emit(name+'_ERROR',{reason:e.message});}
          }
          const targets=[
            ['DEALWORK','https://api.dealwork.ai/api/v1/jobs'],
            ['DEALWORK_ALT','https://dealwork.ai/api/v1/jobs?status=open'],
            ['SWARM_QA5','https://swarmmemo.com/api/work/c96fb3a4fbcda3789dc6eee919256a50'],
            ['SWARM_PACKAGE','https://swarmmemo.com/api/work/f873dabc8ed18a6773b19442c44d4109'],
            ['SWARM_BUG','https://swarmmemo.com/api/work/1b766c6ef793d578031b50ea1e197d4c'],
            ['SWARM_DATA','https://swarmmemo.com/api/work/20ef7df2131fae0b1e58eb843e35913d']
          ];
          for(const [label,url] of targets){
            try{
              const j=await get(url);
              if(label.startsWith('SWARM')){
                const w=j.data?.work;if(j.ok!==true||!w?.id)throw Error('SCHEMA');
                emit(label,{id:w.id,state:w.state,claimable:w.claimable,standing:w.standing,requester:w.requester?.handle});
              }else{
                const rows=Array.isArray(j)?j:j.data?.jobs??j.data??j.jobs;
                if(!Array.isArray(rows))throw Error('SCHEMA');
                emit(label,{count:rows.length,meta:j.meta??null,rows:rows.slice(0,35).map(x=>({id:x.id,title:x.title,status:x.status,budget:x.budget??x.budgetUsd??x.budget_usd,target:x.target??x.target_type??x.worker_type,description:String(x.description??'').slice(0,3000),fields:Object.keys(x)}))});
              }
            }catch(e){emit(label+'_UNAVAILABLE',{reason:e.message});}
          }
          JS
